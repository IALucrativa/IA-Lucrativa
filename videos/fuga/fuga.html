<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pare a Fuga</title>
<style>
  html,body{margin:0;background:#04070f;height:100%;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ================= CONFIG / TEXTOS ================= */
const WORD     = "BANDIDO";
const BRAND    = "@vocedecideai.br";
const FPS      = 30;
const APPROACH = [48, 60, 42, 57, 39, 63, 51];
const STYLE    = [3, 0, 2, 1, 0, 2, 1];
const BANDS    = [5, 5, 5, 5, 5, 5, 5];
const BREAK    = 22;
const OUTRO    = 45;
const T = {
  title:'PARE ANTES DA POLÍCIA TE PEGAR', lvl:'NÍVEL IMPOSSÍVEL', sub:' · SÓ 1 FRAME REVELA A LETRA',
  item:'FUGA', bands:'ESTRELAS', st:['TRANQUILO','SIRENE','PERSEGUIÇÃO','QUASE!','AGORA!','PEGO!'],
  lim:'LIMITE', boom:'PEGO', gauge:'', items:'FUGAS',
  gold:'CARRO DE OURO! LETRA', join:'JUNTE AS 7 LETRAS E COMENTA A PALAVRA',
  q:'ACHOU AS 7 LETRAS?', hint:'PAUSE NO FRAME CERTO EM CADA FUGA', cta:'COMENTA A PALAVRA', follow:'e me segue pra mais desafios',
  c1:'SÓ 1 FRAME', c2:'REVELA A PALAVRA', c3:'VOCÊ CONSEGUE PAUSAR?', fx:'PEGO!'
};

/* ================= TIMELINE ================= */
const ROUNDS = [];
{ let f = 0;
  for (let i = 0; i < WORD.length; i++) {
    ROUNDS.push({ start: f, contact: f + APPROACH[i], end: f + APPROACH[i] + BREAK, A: APPROACH[i], style: STYLE[i] });
    f += APPROACH[i] + BREAK;
  }
}
const OUTRO_START = ROUNDS[ROUNDS.length - 1].end;
const TOTAL_FRAMES = OUTRO_START + OUTRO;

/* ================= HELPERS ================= */
const W = 720, H = 1280;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const S = cv.width / W;
const C = { surf2:'#101928', cyan:'#00c6ff', gold:'#f5c842', green:'#00e5a0', red:'#ff4d5e', orange:'#ff9f43', text:'#e8f0fe', muted:'#8899bb', lime:'#7cff6b' };
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function text(s,x,y,size,color,weight=900,align='center',font='Inter'){
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
function fitText(s,x,y,maxW,size,color,weight=900){
  ctx.font = `${weight} ${size}px Inter`; const w = ctx.measureText(s).width;
  if (w > maxW) size *= maxW / w; text(s,x,y,size,color,weight); }
function ease(p, style){
  if (style===0) return p*p*(3-2*p)*0.35 + p*0.65;
  if (style===1) return Math.pow(p, 1.8);
  if (style===2) return p<0.55 ? p/0.55*0.62 : 0.62 + (p<0.75?0:(p-0.75)/0.25*0.38);
  return 1 - Math.pow(1-p, 1.6);
}

/* ================= GEOMETRY ================= */
const TABLE_Y = 968; let CUR_FRAME = 0;
C.hot='#ff4d6d'; C.yellow='#ffd23f'; C.pink='#ff3da5';
const EVENTS = [];   // estrelas acendendo (audio)
ROUNDS.forEach((r,i)=>{ let last=0; for(let lf=0; lf<=r.A; lf++){ const n=Math.min(5,Math.floor(ease(lf/r.A,r.style)*5.0001)); if(n>last){ EVENTS.push(r.start+lf); last=n; } } });

/* ================= DRAW ================= */
function background(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#04140f'); g.addColorStop(.55,'#04070f'); g.addColorStop(1,'#020409');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,229,160,0.045)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // holofote
  const sp=ctx.createLinearGradient(0,400,0,TABLE_Y); sp.addColorStop(0,'rgba(0,229,160,0)'); sp.addColorStop(1,'rgba(0,229,160,0.10)');
  ctx.fillStyle=sp; ctx.beginPath(); ctx.moveTo(300,400); ctx.lineTo(420,400); ctx.lineTo(640,TABLE_Y); ctx.lineTo(80,TABLE_Y); ctx.fill();
}

function header(){
  fitText(T.title, 360, 150, 650, 40, '#ffffff', 900);
  ctx.font='800 17px Inter';
  const w1=ctx.measureText(T.lvl).width, w2=ctx.measureText(T.sub).width, x0=360-(w1+w2)/2;
  text(T.lvl, x0, 190, 17, C.red, 800, 'left'); text(T.sub, x0+w1, 190, 17, C.green, 800, 'left');
}

function hud(idx, ms, p, nb, broke, gold){
  const x=92,y=228,w=536,h=142;
  const border = gold ? C.gold : broke ? C.red : 'rgba(0,229,160,0.3)';
  ctx.save(); if (gold){ ctx.shadowColor=C.gold; ctx.shadowBlur=28; } if (broke){ ctx.shadowColor=C.red; ctx.shadowBlur=18; }
  rr(x,y,w,h,18); ctx.fillStyle='rgba(8,18,20,0.92)'; ctx.fill(); ctx.restore();
  rr(x,y,w,h,18); ctx.strokeStyle=border; ctx.lineWidth=2.5; ctx.stroke();
  const mono='DejaVu Sans Mono';
  text(`${T.item} ${idx+1}/${WORD.length}`, x+24, y+28, 15, C.muted, 700, 'left', mono);
  text(`${T.bands} ${broke?'---':nb}`, x+w-24, y+28, 15, C.muted, 700, 'right', mono);
  let label, col;
  if (gold){ label=T.st[4]; col=C.gold; }
  else if (broke){ label=T.st[5]; col=C.red; }
  else if (ms>1000){ label=T.st[0]; col=C.green; }
  else if (ms>500){ label=T.st[1]; col=C.lime; }
  else if (ms>200){ label=T.st[2]; col=C.orange; }
  else { label=T.st[3]; col=C.gold; }
  text(label, x+24, y+72, 38, col, 900, 'left');
  const msTxt = (ms>0?'-':ms<0?'+':'') + Math.abs(Math.round(ms)) + ' ms';
  text(msTxt, x+w-24, y+72, 30, gold?C.gold:broke?C.red:C.text, 700, 'right', mono);
  const bx=x+24, by=y+104, bw=w-48, bh=10, lim=0.82;
  rr(bx,by,bw,bh,5); ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fill();
  const g=ctx.createLinearGradient(bx,0,bx+bw*lim,0); g.addColorStop(0,C.green); g.addColorStop(.5,C.lime); g.addColorStop(.85,C.gold); g.addColorStop(1,C.orange);
  rr(bx,by,bw*lim,bh,5); ctx.fillStyle=g; ctx.fill();
  rr(bx+bw*lim+3,by,bw*(1-lim)-3,bh,5); ctx.fillStyle='rgba(255,77,94,0.55)'; ctx.fill();
  const pp=clamp(p,0,1.2), mx = bx + bw*lim*Math.min(pp,1) + (pp>1 ? bw*(1-lim)*(pp-1)/0.2 : 0);
  ctx.fillStyle='#fff'; ctx.fillRect(mx-2,by-7,4,bh+14);
  text(T.lim, bx+bw*lim-6, by+26, 11, C.green, 800, 'right', 'DejaVu Sans Mono');
  text(T.boom, bx+bw-2, by+26, 11, C.red, 800, 'right', 'DejaVu Sans Mono');
}

function gauge(e, broke, frame){
  const cx=360, cy=640, r=118, a0=Math.PI*1.12, a1=Math.PI*1.88;
  // corpo
  ctx.fillStyle='#0d1a1c'; ctx.beginPath(); ctx.arc(cx,cy,r+16,Math.PI,0); ctx.lineTo(cx+r+16,cy+46); ctx.lineTo(cx-r-16,cy+46); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,229,160,0.35)'; ctx.lineWidth=3; ctx.stroke();
  // faixas
  ctx.lineWidth=14; ctx.lineCap='butt';
  const segs=[[0,0.5,C.green],[0.5,0.82,C.gold],[0.82,1,C.red]];
  for(const [s0,s1,c] of segs){ ctx.strokeStyle=c; ctx.globalAlpha=0.85; ctx.beginPath(); ctx.arc(cx,cy,r-12,lerp(a0,a1,s0),lerp(a0,a1,s1)); ctx.stroke(); }
  ctx.globalAlpha=1;
  // marcas
  ctx.strokeStyle='rgba(232,240,254,0.6)'; ctx.lineWidth=2;
  for(let i=0;i<=10;i++){ const a=lerp(a0,a1,i/10), r1=r-30, r2=r-(i%5?38:44);
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2); ctx.stroke(); }
  // ponteiro
  const v = broke ? 1.08 + 0.03*Math.sin(frame*3) : e*0.82 + (e>0.85? Math.sin(frame*4)*0.01:0);
  const a = lerp(a0,a1,clamp(v,0,1.1));
  ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*(r-26),cy+Math.sin(a)*(r-26)); ctx.stroke();
  ctx.fillStyle=C.red; ctx.beginPath(); ctx.arc(cx,cy,10,0,7); ctx.fill();
  text(T.gauge, cx, cy+30, 14, C.muted, 800);
}

function table(){
  const g=ctx.createLinearGradient(0,TABLE_Y,0,TABLE_Y+40); g.addColorStop(0,'#1d3a35'); g.addColorStop(1,'#0e1c1e');
  ctx.fillStyle=g; rr(60,TABLE_Y,600,36,6); ctx.fill();
  ctx.fillStyle=C.green; ctx.fillRect(60,TABLE_Y,600,3);
  ctx.fillStyle='#08100f'; ctx.fillRect(110,TABLE_Y+36,500,260);
  ctx.fillStyle='rgba(0,229,160,0.07)'; for(let x=130;x<600;x+=40) ctx.fillRect(x,TABLE_Y+36,2,260);
}

function sky(scroll, alarm=0){
  const g=ctx.createLinearGradient(0,0,0,720); g.addColorStop(0,'#1a0b3d'); g.addColorStop(.45,'#7b2cbf'); g.addColorStop(.75,'#ff3da5'); g.addColorStop(1,'#ff9f43');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,720);
  // sol listrado
  const sy=560; ctx.save(); ctx.beginPath(); ctx.arc(360,sy,170,0,7); ctx.clip();
  const sg=ctx.createLinearGradient(0,sy-170,0,sy+170); sg.addColorStop(0,'#ffe66d'); sg.addColorStop(1,'#ff3da5'); ctx.fillStyle=sg; ctx.fillRect(190,sy-170,340,340);
  for(let i=0;i<8;i++){ const y=sy+10+i*22, h=4+i*2.2; ctx.clearRect(0,0,0,0); ctx.fillStyle='#ff3da5'; ctx.globalAlpha=0.0; ctx.fillRect(0,0,0,0); ctx.globalAlpha=1;
    const g2=ctx.createLinearGradient(0,0,0,720); g2.addColorStop(0,'#1a0b3d'); g2.addColorStop(.45,'#7b2cbf'); g2.addColorStop(.75,'#ff3da5'); g2.addColorStop(1,'#ff9f43');
    ctx.fillStyle=g2; ctx.fillRect(190,y,340,h); }
  ctx.restore();
  // predios
  const r=rng(11); let x=-((scroll*0.25)%60)-60;
  while (x<W+60){ const w=40+Math.floor(r()*50), h=90+Math.floor(r()*200); const top=700-h;
    ctx.fillStyle='#2a0f4f'; ctx.fillRect(x,top,w,h);
    ctx.fillStyle='rgba(255,210,63,0.55)'; for(let yy=top+12; yy<690; yy+=16) for(let xx=x+6; xx<x+w-6; xx+=12) if (r()>0.55) ctx.fillRect(xx,yy,5,7);
    if (r()>0.7){ ctx.fillStyle=C.cyan; ctx.fillRect(x+w/2-1, top-24, 2, 24); }
    x+=w+6; }
  // mar
  const mg=ctx.createLinearGradient(0,700,0,820); mg.addColorStop(0,'#3a1a6b'); mg.addColorStop(1,'#1a0b3d'); ctx.fillStyle=mg; ctx.fillRect(0,700,W,120);
  ctx.fillStyle='rgba(255,159,67,0.55)'; for(let i=0;i<9;i++){ const y=710+i*12, w=240-i*22+Math.sin(scroll*0.05+i)*10; ctx.fillRect(360-w/2,y,w,3); }
  // calcadao + rua
  ctx.fillStyle='#e8c39e'; ctx.fillRect(0,820,W,26);
  ctx.fillStyle='#24203a'; ctx.fillRect(0,846,W,180);
  ctx.fillStyle='#ffd23f'; for(let x2=-((scroll*2)%120); x2<W; x2+=120) ctx.fillRect(x2,934,60,6);
  ctx.fillStyle='#120821'; ctx.fillRect(0,1026,W,254);
  // palmeiras
  for (let k=0;k<4;k++){ const px = ((k*230 - scroll*1.1) % (W+240) + W+240) % (W+240) - 120; palm(px, 846, 1+0.15*(k%2)); }
  if (alarm>0){ const red = Math.floor(alarm*6)%2===0; ctx.fillStyle = red ? 'rgba(255,40,70,0.22)' : 'rgba(45,120,255,0.22)'; ctx.fillRect(0,0,W,H); }
}
function palm(x, base, s){
  ctx.save(); ctx.translate(x,base); ctx.scale(s,s);
  ctx.strokeStyle='#1a0b2e'; ctx.lineWidth=12; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(14,-120,-6,-250); ctx.stroke();
  ctx.fillStyle='#1a0b2e';
  for (let i=0;i<7;i++){ const a=-Math.PI/2 + (i-3)*0.5; ctx.save(); ctx.translate(-6,-250); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(50,-22,110,14); ctx.quadraticCurveTo(50,-4,0,8); ctx.fill(); ctx.restore(); }
  ctx.restore();
}
function pig(cx, gold, letter, worry, t){
  const by = 870;      // centro do corpo
  ctx.save();
  // sombra
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(cx, TABLE_Y+2, 135, 12, 0, 0, 7); ctx.fill();
  const body = gold ? ['#fff2a8','#f5c842','#b8860b'] : ['#ffc4d6','#ff8fb1','#d9577f'];
  const edge = gold ? '#8a6200' : '#b8466a';
  // pernas
  ctx.fillStyle = gold ? '#d9a520' : '#f07aa0';
  for (const lx of [-78,-42,40,76]) { rr(cx+lx-14, by+40, 28, TABLE_Y-(by+40), 8); ctx.fill(); }
  // rabo
  ctx.strokeStyle=body[2]; ctx.lineWidth=5; ctx.beginPath();
  for(let a=0;a<=Math.PI*3;a+=0.2){ const r=4+a*2.2; const x=cx-128-r*Math.cos(a), y=by-10-r*Math.sin(a)*0.8; a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();
  // orelha de tras
  ctx.fillStyle=body[2]; ctx.beginPath(); ctx.moveTo(cx+38,by-66); ctx.lineTo(cx+50,by-86); ctx.lineTo(cx+76,by-70); ctx.fill();
  // corpo
  const g=ctx.createRadialGradient(cx-40,by-50,10,cx,by,150); g.addColorStop(0,body[0]); g.addColorStop(.5,body[1]); g.addColorStop(1,body[2]);
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,by,132,78,0,0,7); ctx.fill();
  ctx.strokeStyle=edge; ctx.lineWidth=2.5; ctx.stroke();
  // fenda da moeda
  ctx.fillStyle = gold ? '#7a5600' : '#6b1f3a'; rr(cx-34, by-77, 60, 9, 4); ctx.fill();
  // focinho
  ctx.fillStyle = gold ? '#e8b42a' : '#ff7aa3'; ctx.beginPath(); ctx.ellipse(cx+132,by+8,24,30,0,0,7); ctx.fill();
  ctx.strokeStyle=edge; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle=edge; ctx.beginPath(); ctx.ellipse(cx+136,by-2,4,7,0,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx+136,by+18,4,7,0,0,7); ctx.fill();
  // orelha da frente
  ctx.fillStyle = gold ? '#f0c040' : '#ff9fbd'; ctx.beginPath(); ctx.moveTo(cx+62,by-66); ctx.lineTo(cx+80,by-88); ctx.lineTo(cx+106,by-58); ctx.fill();
  ctx.strokeStyle=edge; ctx.lineWidth=2; ctx.stroke();
  // olho (olha pra cima quando preocupado)
  const ex=cx+92, ey=by-22;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(ex,ey,13,15+worry*3,0,0,7); ctx.fill();
  ctx.fillStyle='#10131c'; ctx.beginPath(); ctx.arc(ex+3-worry*2, ey+4-worry*10, 6.5, 0, 7); ctx.fill();
  if (worry>0.3){ // sobrancelha preocupada
    ctx.strokeStyle=edge; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ex-14,ey-22-worry*4); ctx.lineTo(ex+12,ey-30); ctx.stroke();
  }
  // bochecha
  if(!gold){ ctx.fillStyle='rgba(255,90,140,0.35)'; ctx.beginPath(); ctx.ellipse(cx+90,by+16,16,9,0,0,7); ctx.fill(); }
  // gota de suor
  if (worry>0.55 && !gold){
    const dy = (t*60)%26;
    ctx.fillStyle='rgba(126,224,255,0.9)'; ctx.beginPath(); ctx.moveTo(cx+60,by-60+dy); ctx.quadraticCurveTo(cx+50,by-44+dy,cx+60,by-40+dy); ctx.quadraticCurveTo(cx+70,by-44+dy,cx+60,by-60+dy); ctx.fill();
  }
  // letra dourada
  if (gold){
    ctx.save(); ctx.shadowColor='rgba(90,60,0,0.8)'; ctx.shadowOffsetY=5; ctx.shadowBlur=0;
    text(letter, cx-24, by+8, 104, '#fffbe6', 900); ctx.restore();
    ctx.textAlign='center'; ctx.strokeStyle='rgba(122,86,0,0.6)'; ctx.lineWidth=2; ctx.font='900 104px Inter'; ctx.strokeText(letter,cx-24,by+8);
  }
  ctx.restore();
}
function pigCool(px, py, sc, t){
  ctx.save(); ctx.translate(px, py - 870*sc); ctx.scale(sc,sc);
  pig(0, false, '', 0, t);
  // oculos escuros
  ctx.fillStyle='#111'; rr(60, 834, 64, 26, 10); ctx.fill();
  ctx.fillStyle='rgba(45,226,230,0.75)'; ctx.fillRect(68, 838, 22, 5);
  ctx.strokeStyle='#111'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(60,846); ctx.lineTo(22,838); ctx.stroke();
  ctx.restore();
}


const easeO = p=>1-Math.pow(1-clamp(p,0,1),3);
function background(){
  sky(CUR_FRAME*3, 0);
  const g=ctx.createLinearGradient(0,0,0,400); g.addColorStop(0,'rgba(10,4,20,0.9)'); g.addColorStop(1,'rgba(10,4,20,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,400);
}
function bodyPath(){ ctx.beginPath(); ctx.moveTo(-200,10); ctx.quadraticCurveTo(-200,-26,-160,-28); ctx.lineTo(-40,-28); ctx.lineTo(60,-20); ctx.lineTo(170,-8);
  ctx.quadraticCurveTo(205,-2,205,22); ctx.lineTo(205,40); ctx.lineTo(-200,40); ctx.closePath(); }
function vehicle(cx, cy, s, police, gold, frame, moving){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0,64,200,14,0,0,7); ctx.fill();
  const g=ctx.createLinearGradient(0,-30,0,50);
  if (police){ g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#c9cedb'); } else if (gold){ g.addColorStop(0,'#fff3b0'); g.addColorStop(.5,'#f5c842'); g.addColorStop(1,'#9c6c00'); } else { g.addColorStop(0,'#ff6ec7'); g.addColorStop(1,'#c2187a'); }
  ctx.fillStyle=g; bodyPath(); ctx.fill();
  if (police){ ctx.save(); bodyPath(); ctx.clip(); ctx.fillStyle='#14161f'; ctx.fillRect(-210,12,420,40); ctx.fillStyle='#14161f'; ctx.fillRect(-70,-30,70,42); ctx.restore();
    text('POLÍCIA', 40, -8, 22, '#14161f', 900);
    const on=Math.floor(frame/3)%2===0; ctx.fillStyle='#333'; rr(-70,-46,100,12,4); ctx.fill();
    ctx.fillStyle= on?'#ff2e4d':'#5a1020'; rr(-68,-48,46,14,5); ctx.fill(); ctx.fillStyle= on?'#2a3d6e':'#2d7bff'; rr(-18,-48,46,14,5); ctx.fill(); }
  ctx.strokeStyle= gold?'#7a5600': police?'#2a2d38':'#5a0b3a'; ctx.lineWidth=3; bodyPath(); ctx.stroke();
  if (!police){ ctx.fillStyle= gold?'#fff6c0':C.cyan; ctx.fillRect(-190,6,390,4); }
  ctx.strokeStyle='rgba(45,226,230,0.9)'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(40,-24); ctx.lineTo(10,-70); ctx.stroke();
  ctx.fillStyle='#fff6b0'; rr(186,0,16,12,4); ctx.fill(); ctx.fillStyle=C.hot; rr(-200,-6,10,14,3); ctx.fill();
  for (const wx of [-120,120]){ ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(wx,40,32,0,7); ctx.fill();
    ctx.fillStyle='#c9c9e0'; ctx.beginPath(); ctx.arc(wx,40,16,0,7); ctx.fill();
    ctx.strokeStyle='#555'; ctx.lineWidth=3; for(let k=0;k<5;k++){ const a=k/5*Math.PI*2+(moving?frame*0.9:0); ctx.beginPath(); ctx.moveTo(wx,40); ctx.lineTo(wx+Math.cos(a)*15,40+Math.sin(a)*15); ctx.stroke(); } }
  ctx.restore();
}
function starShape(x,y,r){ ctx.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr2=k%2?r*0.42:r; ctx.lineTo(x+Math.cos(a)*rr2, y+Math.sin(a)*rr2); } ctx.closePath(); }
function wanted(n, broke, frame){
  for (let i=0;i<5;i++){ const x=360+(i-2)*72, y=430, on=i<n, fl = broke && Math.floor(frame/3)%2===0;
    starShape(x,y,28); ctx.fillStyle= on ? (fl?'#ffffff':C.yellow) : 'rgba(255,255,255,0.14)'; ctx.fill(); ctx.strokeStyle='#120821'; ctx.lineWidth=4; ctx.stroke(); }
}
const CAR_X = 520, CAR_Y = 900, SC_V = 0.7, CONTACT_X = 237, POLICE_START = -260;
function crash(round, tb, bx){
  const R=rng(round.start*7919+3), g=2200, ix=380, iy=880;
  if (tb<0.07){ ctx.fillStyle=`rgba(255,255,255,${0.45*(1-tb/0.07)})`; ctx.fillRect(0,0,W,H); }
  if (tb<0.3) for(let i=0;i<18;i++){ const a=R()*Math.PI*2, sp=400+R()*700, x=ix+Math.cos(a)*sp*tb, y=iy+Math.sin(a)*sp*tb*0.7;
    ctx.strokeStyle='#ffd23f'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-Math.cos(a)*18,y-Math.sin(a)*12); ctx.stroke(); }
  for(let i=0;i<22;i++){ const vx=(R()-0.3)*700, vy=-500-R()*700, x=bx-60+(R()-0.5)*120+vx*tb, y=860+vy*tb+0.5*g*tb*tb*0.6;
    ctx.save(); ctx.translate(x,y); ctx.rotate(tb*(6+i%5)+i); ctx.fillStyle='#3cb371'; ctx.fillRect(-18,-9,36,18); ctx.strokeStyle='#1d6b40'; ctx.lineWidth=2; ctx.strokeRect(-18,-9,36,18);
    text('$',0,1,14,'#0d3d22',900); ctx.restore(); }
  for(let i=0;i<10;i++){ const vx=(R()-0.5)*600, vy=-300-R()*500, x=ix+vx*tb, y=iy+vy*tb+0.5*g*tb*tb, s=6+R()*8;
    ctx.fillStyle='rgba(170,230,255,0.9)'; ctx.beginPath(); ctx.moveTo(x-s,y); ctx.lineTo(x+s*0.6,y-s*0.8); ctx.lineTo(x+s*0.4,y+s*0.7); ctx.fill(); }
  for(let i=0;i<6;i++){ const k=clamp(tb/0.7,0,1); ctx.fillStyle=`rgba(200,200,220,${0.4*(1-k)})`; ctx.beginPath(); ctx.arc(ix+(i-2.5)*30, iy-20-k*80-i*6, 20+k*40, 0, 7); ctx.fill(); }
  const k=clamp(tb/0.1,0,1), sc=1.6-0.6*easeO(k);
  ctx.save(); ctx.translate(360,700); ctx.rotate(-0.1); ctx.scale(sc,sc); ctx.globalAlpha=Math.min(1,k*1.5);
  rr(-170,-62,340,124,14); ctx.fillStyle='rgba(18,8,33,0.85)'; ctx.fill(); ctx.strokeStyle='#ff2e4d'; ctx.lineWidth=10; ctx.stroke();
  text(T.fx, 0, 4, 92, '#ff2e4d', 900); ctx.restore();
}
function scene(ri, round, lf, e, gold, broke, worry, jitter, frame){
  const tb = broke ? (lf-round.A)/FPS : 0;
  wanted(broke ? 5 : Math.min(5, Math.floor(e*5.0001)), broke, frame);
  const px = broke ? CONTACT_X - 30*clamp(tb/0.1,0,1) : POLICE_START + (CONTACT_X-POLICE_START)*e;
  const jolt = broke ? 80*easeO(clamp(tb/0.15,0,1)) : (jitter||0);
  const bx = CAR_X + jolt;
  ctx.save(); if (broke && tb<0.3){ ctx.translate(bx,CAR_Y); ctx.rotate(-0.08*Math.sin(tb*30)*(1-tb/0.3)); ctx.translate(-bx,-CAR_Y); }
  pigCool(bx-27, 862, 0.448, frame/FPS);
  vehicle(bx, CAR_Y, SC_V, false, gold, frame, !broke);
  if (gold){ ctx.save(); ctx.shadowColor='rgba(90,60,0,0.8)'; ctx.shadowOffsetY=4; text(WORD[ri], bx-20, CAR_Y+12, 66, '#fffbe6', 900); ctx.restore(); }
  ctx.restore();
  vehicle(px, CAR_Y, SC_V, true, false, frame, !broke);
  if (!broke){ const on=Math.floor(frame/3)%2===0; const rg=ctx.createRadialGradient(px-15,CAR_Y-40,5,px-15,CAR_Y-40,160);
    rg.addColorStop(0, on?'rgba(255,46,77,0.45)':'rgba(45,123,255,0.45)'); rg.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=rg; ctx.fillRect(px-200,CAR_Y-220,400,320); }
  if (worry>0.55 && !broke && !gold){ const dy=(frame*2)%22, sx=bx+28, sy=790+dy; ctx.fillStyle='rgba(126,224,255,0.95)'; ctx.beginPath(); ctx.moveTo(sx,sy-10); ctx.quadraticCurveTo(sx-8,sy+4,sx,sy+6); ctx.quadraticCurveTo(sx+8,sy+4,sx,sy-10); ctx.fill(); }
  if (gold) sparkles(bx, 880);
  if (broke) crash(round, tb, bx);
}
function coverScene(){ ctx.translate(0,-90); pigCool(CAR_X-27, 862, 0.448, 0.2); vehicle(CAR_X, CAR_Y, SC_V, false, false, 4, false); vehicle(CONTACT_X-30, CAR_Y, SC_V, true, false, 0, false); }

function sparkles(cx,cy){
  ctx.fillStyle='#fff';
  for (const [dx,dy,s] of [[-250,-80,16],[250,-50,12],[-230,70,10],[245,80,14],[-60,-150,9],[120,-140,11]]){
    const x=cx+dx,y=cy+dy; ctx.beginPath();
    ctx.moveTo(x,y-s); ctx.quadraticCurveTo(x,y,x+s,y); ctx.quadraticCurveTo(x,y,x,y+s); ctx.quadraticCurveTo(x,y,x-s,y); ctx.quadraticCurveTo(x,y,x,y-s); ctx.fill();
  }
}

function goldBanner(idx){
  const x=40,y=500,w=640,h=108;
  ctx.save(); ctx.shadowColor=C.gold; ctx.shadowBlur=30; rr(x,y,w,h,18); ctx.fillStyle='rgba(20,16,4,0.96)'; ctx.fill(); ctx.restore();
  rr(x,y,w,h,18); ctx.strokeStyle=C.gold; ctx.lineWidth=3; ctx.stroke();
  fitText(`${T.gold} ${idx+1}/${WORD.length}`, 360, y+38, 590, 30, C.gold, 900);
  fitText(T.join, 360, y+78, 590, 22, '#ffffff', 800);
}

function outro(f){
  const k = clamp(f/8,0,1);
  ctx.fillStyle=`rgba(4,7,15,${0.88*k})`; ctx.fillRect(0,0,W,H);
  if (k<1) return;
  const pop = 1 + 0.06*Math.sin(f*0.25);
  ctx.save(); ctx.translate(360,520); ctx.scale(pop,pop); fitText(T.q, 0, 0, 620, 54, '#ffffff', 900); ctx.restore();
  fitText(T.hint, 360, 580, 620, 20, C.green, 800);
  const n=WORD.length, sw=74, gap=12, x0=360-(n*sw+(n-1)*gap)/2;
  for(let i=0;i<n;i++){
    const x=x0+i*(sw+gap), y=660, d=clamp((f-10-i*2)/6,0,1);
    ctx.globalAlpha=d; rr(x,y,sw,92,14); ctx.fillStyle=C.surf2; ctx.fill(); ctx.strokeStyle=C.gold; ctx.lineWidth=3; ctx.stroke();
    text('?', x+sw/2, y+48, 48, C.gold, 900); ctx.globalAlpha=1;
  }
  const b = clamp((f-22)/6,0,1); ctx.globalAlpha=b;
  rr(110,820,500,86,43); ctx.fillStyle=C.green; ctx.fill();
  fitText(T.cta, 360, 864, 440, 32, '#04130d', 900);
  text(T.follow, 360, 950, 24, C.text, 600);
  ctx.globalAlpha=1;
}

/* ================= FRAME ================= */
function render(frame){
  ctx.setTransform(S,0,0,S,0,0);
  CUR_FRAME=frame; background(); header();
  let ri = ROUNDS.findIndex(r=>frame<r.end); if (ri<0) ri = ROUNDS.length-1;
  const round = ROUNDS[ri];
  const lf = Math.min(frame, round.end-1) - round.start;
  const gold = lf===round.A, broke = lf>round.A;
  const p = lf/round.A, e = ease(clamp(p,0,1), round.style);
  const ms = (round.A-lf)*1000/FPS;
  const nb = Math.round(BANDS[ri]*e);
  const worry = broke?0:clamp(1-ms/900,0,1);
  const jitter = (!broke && !gold && worry>0.5) ? Math.sin(frame*2.9)*2.5*worry : 0;
  let sx=0, sy=0;
  if (broke){ const tb=(lf-round.A)/FPS; if (tb<0.18){ const R=rng(frame); sx=(R()-0.5)*18*(1-tb/0.18); sy=(R()-0.5)*18*(1-tb/0.18);} }

  ctx.save(); ctx.translate(sx,sy);
  scene(ri, round, lf, e, gold, broke, worry, jitter, frame);
  ctx.restore();

  hud(ri, ms, p, nb, broke, gold);
  if (gold) goldBanner(ri);

  for(let i=0;i<ROUNDS.length;i++){
    const x=360+(i-(ROUNDS.length-1)/2)*44, y=1110, done=i<ri||(i===ri&&broke), cur=i===ri&&!broke;
    ctx.beginPath(); ctx.arc(x,y,cur?13:10,0,7);
    ctx.fillStyle= done?'rgba(255,77,94,0.85)': cur?C.green:'rgba(255,255,255,0.08)'; ctx.fill();
    if(cur){ ctx.strokeStyle='rgba(0,229,160,0.35)'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(x,y,20,0,7); ctx.stroke(); }
  }
  text(T.items, 360, 1150, 14, 'rgba(136,153,187,0.8)', 800);
  text(BRAND, 360, 1215, 18, 'rgba(232,240,254,0.4)', 800);
  if (frame>=OUTRO_START) outro(frame-OUTRO_START);
}

/* ================= CAPA ================= */
function renderCover(){
  ctx.setTransform(S,0,0,S,0,0);
  background();
  ctx.save(); ctx.translate(0,90);
  coverScene();
  ctx.strokeStyle=C.red; ctx.lineWidth=5; ctx.lineCap='round';
  for (const [x1,y1,x2,y2] of [[130,760,95,735],[590,760,625,735],[120,820,80,820],[600,820,640,820]]){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ctx.translate(360,196); ctx.rotate(-0.04);
  rr(-170,-26,340,52,26); ctx.fillStyle=C.red; ctx.fill(); fitText(T.lvl, 0, 1, 310, 26, '#fff', 900); ctx.restore();
  ctx.save(); ctx.shadowColor='rgba(245,200,66,0.6)'; ctx.shadowBlur=30;
  fitText(T.c1, 360, 300, 640, 118, C.gold, 900); ctx.restore();
  fitText(T.c2, 360, 392, 640, 62, '#ffffff', 900);
  ctx.save(); ctx.translate(360,560); ctx.rotate(-0.03);
  rr(-200,-44,400,88,22); ctx.fillStyle='rgba(8,18,20,0.95)'; ctx.fill(); ctx.strokeStyle=C.green; ctx.lineWidth=3; ctx.stroke();
  text('5', -105, 0, 50, C.gold, 900); fitText(T.bands, 55, 0, 200, 30, '#fff', 900); ctx.restore();
  rr(120,1150,480,80,40); ctx.fillStyle=C.green; ctx.fill();
  fitText(T.c3, 360, 1191, 440, 28, '#04130d', 900);
  return cv.toDataURL('image/png');
}

window.TOTAL_FRAMES = TOTAL_FRAMES; window.ROUNDS = ROUNDS; window.OUTRO_START = OUTRO_START; window.META = { theme:'fuga', total: TOTAL_FRAMES, rounds: ROUNDS, outro: OUTRO_START, events: EVENTS };
window.renderFrame = f => { render(f); return cv.toDataURL('image/png'); };
window.renderCover = renderCover;

if (!location.search.includes('export')){
  let f=0, paused=false, last=performance.now(), acc=0;
  const toggle=()=>paused=!paused; cv.addEventListener('click',toggle);
  addEventListener('keydown',e=>{ if(e.code==='Space'){toggle();e.preventDefault();}
    if(paused&&e.code==='ArrowRight'){f=(f+1)%TOTAL_FRAMES;render(f);} if(paused&&e.code==='ArrowLeft'){f=(f-1+TOTAL_FRAMES)%TOTAL_FRAMES;render(f);} });
  document.fonts.ready.then(()=>{ (function loop(now){ acc+=now-last; last=now;
    if(!paused){ while(acc>=1000/FPS){ acc-=1000/FPS; f=(f+1)%TOTAL_FRAMES; } render(f);} else acc=0;
    requestAnimationFrame(loop); })(performance.now()); });
}
