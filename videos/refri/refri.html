<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pare o Refri</title>
<style>
  html,body{margin:0;background:#04070f;height:100%;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ================= CONFIG / TEXTOS ================= */
const WORD     = "CAMPEÃO";
const BRAND    = "@vocedecideai.br";
const FPS      = 30;
const APPROACH = [51, 63, 45, 57, 42, 60, 39];
const STYLE    = [1, 0, 3, 2, 1, 0, 2];
const BANDS    = [48, 55, 44, 60, 41, 58, 52];
const BREAK    = 22;
const OUTRO    = 45;
const T = {
  title:'PARE ANTES DO REFRI EXPLODIR', lvl:'NÍVEL IMPOSSÍVEL', sub:' · SÓ A LETRA DO 0 MS VALE',
  item:'GARRAFA', bands:'SACUDIDAS', st:['PARADA','AGITANDO','BORBULHANDO','QUASE!','AGORA!','EXPLODIU!'],
  lim:'LIMITE', boom:'EXPLOSÃO', gauge:'', items:'GARRAFAS',
  gold:'', join:'',
  q:'ACHOU AS 7 LETRAS?', hint:'PAUSE NO FRAME CERTO EM CADA GARRAFA', cta:'COMENTA A PALAVRA', follow:'e me segue pra mais desafios',
  c1:'SÓ 1 FRAME', c2:'REVELA A PALAVRA', c3:'VOCÊ CONSEGUE PAUSAR?', fx:'PSHHH!'
};

/* ================= TIMELINE ================= */
const ROUNDS = [];
{ let f = 0;
  for (let i = 0; i < WORD.length; i++) {
    ROUNDS.push({ start: f, contact: f + APPROACH[i], end: f + APPROACH[i] + BREAK, A: APPROACH[i], style: STYLE[i] });
    f += APPROACH[i] + BREAK;
  }
}
const OUTRO_START = ROUNDS[ROUNDS.length - 1].end;
const TOTAL_FRAMES = OUTRO_START + OUTRO;
/* letras falsas: a cada frame aparece uma letra aleatoria; so o frame do 0 ms tem a letra certa */
const DECOY_AB = 'ABCDEFGHIJLMNOPQRSTUVXZ';
function letterAt(ri, lf, A, frame){ if (lf===A) return WORD[ri]; if (lf>A) return ''; const R=rng(frame*977+13); let c; do { c=DECOY_AB[Math.floor(R()*DECOY_AB.length)]; } while (c===WORD[ri]); return c; }

/* ================= HELPERS ================= */
const W = 720, H = 1280;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const S = cv.width / W;
const C = { surf2:'#101928', cyan:'#00c6ff', gold:'#f5c842', green:'#00e5a0', red:'#ff4d5e', orange:'#ff9f43', text:'#e8f0fe', muted:'#8899bb', lime:'#7cff6b' };
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function text(s,x,y,size,color,weight=900,align='center',font='Inter'){
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
function fitText(s,x,y,maxW,size,color,weight=900){
  ctx.font = `${weight} ${size}px Inter`; const w = ctx.measureText(s).width;
  if (w > maxW) size *= maxW / w; text(s,x,y,size,color,weight); }
function ease(p, style){
  if (style===0) return p*p*(3-2*p)*0.35 + p*0.65;
  if (style===1) return Math.pow(p, 1.8);
  if (style===2) return p<0.55 ? p/0.55*0.62 : 0.62 + (p<0.75?0:(p-0.75)/0.25*0.38);
  if (style===4) return p<0.5 ? p/0.5*0.85 : p<0.7 ? 0.85-(p-0.5)/0.2*0.2 : 0.65+(p-0.7)/0.3*0.35;   // finta: chega perto, recua e dispara
  return 1 - Math.pow(1-p, 1.6);
}

/* ================= GEOMETRY ================= */
const TABLE_Y = 968, BX = 360, BASE = 958;
const EVENTS = [];   // sacudidas (audio)
ROUNDS.forEach((r,i)=>{ let ph=0, last=0; for(let lf=0; lf<=r.A; lf++){ const e=ease(lf/r.A,r.style); ph += 0.6+1.4*e; const n=Math.floor(ph/Math.PI); if(n>last && e>0.05){ EVENTS.push(r.start+lf); last=n; } } });

/* ================= DRAW ================= */
function background(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#140a04'); g.addColorStop(.55,'#04070f'); g.addColorStop(1,'#020409');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,159,67,0.05)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // holofote
  const sp=ctx.createLinearGradient(0,400,0,TABLE_Y); sp.addColorStop(0,'rgba(255,159,67,0)'); sp.addColorStop(1,'rgba(255,159,67,0.10)');
  ctx.fillStyle=sp; ctx.beginPath(); ctx.moveTo(300,400); ctx.lineTo(420,400); ctx.lineTo(640,TABLE_Y); ctx.lineTo(80,TABLE_Y); ctx.fill();
}

function header(){
  fitText(T.title, 360, 150, 650, 40, '#ffffff', 900);
  ctx.font='800 17px Inter';
  const w1=ctx.measureText(T.lvl).width, w2=ctx.measureText(T.sub).width, x0=360-(w1+w2)/2;
  text(T.lvl, x0, 190, 17, C.red, 800, 'left'); text(T.sub, x0+w1, 190, 17, C.green, 800, 'left');
}

function hud(idx, ms, p, nb, broke, gold){
  const x=92,y=228,w=536,h=142;
  const border = gold ? C.gold : broke ? C.red : 'rgba(0,229,160,0.3)';
  ctx.save(); if (gold){ ctx.shadowColor=C.gold; ctx.shadowBlur=28; } if (broke){ ctx.shadowColor=C.red; ctx.shadowBlur=18; }
  rr(x,y,w,h,18); ctx.fillStyle='rgba(8,18,20,0.92)'; ctx.fill(); ctx.restore();
  rr(x,y,w,h,18); ctx.strokeStyle=border; ctx.lineWidth=2.5; ctx.stroke();
  const mono='DejaVu Sans Mono';
  text(`${T.item} ${idx+1}/${WORD.length}`, x+24, y+28, 15, C.muted, 700, 'left', mono);
  text(`${T.bands} ${broke?'---':nb}`, x+w-24, y+28, 15, C.muted, 700, 'right', mono);
  let label, col;
  if (gold){ label=T.st[4]; col=C.gold; }
  else if (broke){ label=T.st[5]; col=C.red; }
  else if (ms>1000){ label=T.st[0]; col=C.green; }
  else if (ms>500){ label=T.st[1]; col=C.lime; }
  else if (ms>200){ label=T.st[2]; col=C.orange; }
  else { label=T.st[3]; col=C.gold; }
  text(label, x+24, y+72, 38, col, 900, 'left');
  const msTxt = (ms>0?'-':ms<0?'+':'') + Math.abs(Math.round(ms)) + ' ms';
  text(msTxt, x+w-24, y+72, 30, gold?C.gold:broke?C.red:C.text, 700, 'right', mono);
  const bx=x+24, by=y+104, bw=w-48, bh=10, lim=0.82;
  rr(bx,by,bw,bh,5); ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fill();
  const g=ctx.createLinearGradient(bx,0,bx+bw*lim,0); g.addColorStop(0,C.green); g.addColorStop(.5,C.lime); g.addColorStop(.85,C.gold); g.addColorStop(1,C.orange);
  rr(bx,by,bw*lim,bh,5); ctx.fillStyle=g; ctx.fill();
  rr(bx+bw*lim+3,by,bw*(1-lim)-3,bh,5); ctx.fillStyle='rgba(255,77,94,0.55)'; ctx.fill();
  const pp=clamp(p,0,1.2), mx = bx + bw*lim*Math.min(pp,1) + (pp>1 ? bw*(1-lim)*(pp-1)/0.2 : 0);
  ctx.fillStyle='#fff'; ctx.fillRect(mx-2,by-7,4,bh+14);
  text(T.lim, bx+bw*lim-6, by+26, 11, C.green, 800, 'right', 'DejaVu Sans Mono');
  text(T.boom, bx+bw-2, by+26, 11, C.red, 800, 'right', 'DejaVu Sans Mono');
}

function gauge(e, broke, frame){
  const cx=360, cy=640, r=118, a0=Math.PI*1.12, a1=Math.PI*1.88;
  // corpo
  ctx.fillStyle='#0d1a1c'; ctx.beginPath(); ctx.arc(cx,cy,r+16,Math.PI,0); ctx.lineTo(cx+r+16,cy+46); ctx.lineTo(cx-r-16,cy+46); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,229,160,0.35)'; ctx.lineWidth=3; ctx.stroke();
  // faixas
  ctx.lineWidth=14; ctx.lineCap='butt';
  const segs=[[0,0.5,C.green],[0.5,0.82,C.gold],[0.82,1,C.red]];
  for(const [s0,s1,c] of segs){ ctx.strokeStyle=c; ctx.globalAlpha=0.85; ctx.beginPath(); ctx.arc(cx,cy,r-12,lerp(a0,a1,s0),lerp(a0,a1,s1)); ctx.stroke(); }
  ctx.globalAlpha=1;
  // marcas
  ctx.strokeStyle='rgba(232,240,254,0.6)'; ctx.lineWidth=2;
  for(let i=0;i<=10;i++){ const a=lerp(a0,a1,i/10), r1=r-30, r2=r-(i%5?38:44);
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2); ctx.stroke(); }
  // ponteiro
  const v = broke ? 1.08 + 0.03*Math.sin(frame*3) : e*0.82 + (e>0.85? Math.sin(frame*4)*0.01:0);
  const a = lerp(a0,a1,clamp(v,0,1.1));
  ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*(r-26),cy+Math.sin(a)*(r-26)); ctx.stroke();
  ctx.fillStyle=C.red; ctx.beginPath(); ctx.arc(cx,cy,10,0,7); ctx.fill();
  text(T.gauge, cx, cy+30, 14, C.muted, 800);
}

function table(){
  const g=ctx.createLinearGradient(0,TABLE_Y,0,TABLE_Y+40); g.addColorStop(0,'#1d3a35'); g.addColorStop(1,'#0e1c1e');
  ctx.fillStyle=g; rr(60,TABLE_Y,600,36,6); ctx.fill();
  ctx.fillStyle=C.green; ctx.fillRect(60,TABLE_Y,600,3);
  ctx.fillStyle='#08100f'; ctx.fillRect(110,TABLE_Y+36,500,260);
  ctx.fillStyle='rgba(0,229,160,0.07)'; for(let x=130;x<600;x+=40) ctx.fillRect(x,TABLE_Y+36,2,260);
}

function cloth(){
  table();
  ctx.save(); rr(60,TABLE_Y,600,36,6); ctx.clip();
  for (let x=60;x<660;x+=30) for (let k=0;k<2;k++){ ctx.fillStyle=((x/30+k)%2)?'#e8e8ee':'#e0344a'; ctx.fillRect(x,TABLE_Y+k*18,30,18); }
  ctx.restore(); ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(60,TABLE_Y+30,600,6);
}
function bottlePath(sx){
  const w=86*sx, nw=30, top=530;
  ctx.beginPath();
  ctx.moveTo(-nw, top+30); ctx.lineTo(-nw, 600);
  ctx.bezierCurveTo(-nw, 630, -w, 640, -w, 690);
  ctx.lineTo(-w, BASE-40); ctx.quadraticCurveTo(-w, BASE, -w+30, BASE); ctx.lineTo(w-30, BASE); ctx.quadraticCurveTo(w, BASE, w, BASE-40);
  ctx.lineTo(w, 690); ctx.bezierCurveTo(w, 640, nw, 630, nw, 600); ctx.lineTo(nw, top+30); ctx.closePath();
}
function bottle(e, letter, worry, frame, shake, empty=false){
  const sx = 1 + 0.07*e;
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(BX,TABLE_Y+2,110,10,0,0,7); ctx.fill();
  ctx.save(); ctx.translate(BX, BASE); ctx.rotate(shake); ctx.translate(0, -BASE);
  // liquido
  ctx.save(); bottlePath(sx); ctx.clip();
  ctx.fillStyle='rgba(200,230,255,0.10)'; ctx.fillRect(-120,500,240,500);
  const lvl = empty ? 905 : 650;
  const lg=ctx.createLinearGradient(0,lvl,0,BASE); lg.addColorStop(0,'#5a2a12'); lg.addColorStop(1,'#2a0e05'); ctx.fillStyle=lg; ctx.fillRect(-120,lvl,240,BASE-lvl);
  if (!empty){
    const foam = 10 + 70*e; ctx.fillStyle='#f3e3c8'; ctx.fillRect(-120, lvl-foam, 240, foam);
    ctx.fillStyle='rgba(255,255,255,0.6)'; for(let i=0;i<14;i++){ ctx.beginPath(); ctx.arc(-80+i*12, lvl-foam, 7, 0, 7); ctx.fill(); }
    const R=rng(7); const nb = 12 + Math.floor(50*e);
    for (let i=0;i<nb;i++){ const x=-75+R()*150, sp=40+R()*120*(0.5+e), y=BASE-8-((frame*sp/10 + R()*400)%(BASE-lvl-12));
      ctx.strokeStyle='rgba(255,220,180,0.55)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x, y, 2+R()*4, 0, 7); ctx.stroke(); }
  }
  ctx.restore();
  // vidro
  bottlePath(sx); ctx.strokeStyle='rgba(220,240,255,0.75)'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.28)'; ctx.fillRect(-60*sx, 700, 10, 220);
  // rotulo
  const lw=86*sx*2+4; ctx.fillStyle='#ff8a1c'; ctx.fillRect(-lw/2, 760, lw, 92); ctx.fillStyle='#c9520a'; ctx.fillRect(-lw/2, 760, lw, 8); ctx.fillRect(-lw/2, 844, lw, 8);
  if (letter) text(letter, 0, 808, 62, '#7a2e00', 900);           // letra discreta no lugar do nome
  else text('REFRI', 0, 808, 40, '#fff4e0', 900);
  // tampa
  if (!empty){ const lift = 6*e*e;
    ctx.fillStyle='#d62828'; rr(-36, 506-lift, 72, 32, 6); ctx.fill();
    ctx.strokeStyle='#8a1010'; ctx.lineWidth=2; for (let k=0;k<7;k++){ const x=-30+((k*10+frame*e*6)%64); ctx.beginPath(); ctx.moveTo(x,510-lift); ctx.lineTo(x,534-lift); ctx.stroke(); } }
  // rostinho
  const ey=715, es=13;
  if (empty){ ctx.strokeStyle='#222'; ctx.lineWidth=4; for (const s of [-1,1]){ const ex=s*30; ctx.beginPath(); ctx.moveTo(ex-9,ey-9); ctx.lineTo(ex+9,ey+9); ctx.moveTo(ex+9,ey-9); ctx.lineTo(ex-9,ey+9); ctx.stroke(); } }
  else {
    for (const s of [-1,1]){ const ex=s*30;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(ex,ey,es,es*(1.15+worry*0.3),0,0,7); ctx.fill();
      ctx.fillStyle='#10131c'; ctx.beginPath(); ctx.arc(ex, ey+3-worry*8, es*0.5, 0, 7); ctx.fill();
      if (worry>0.3){ ctx.strokeStyle='#fff'; ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(ex-s*14, ey-es*1.6-worry*4); ctx.lineTo(ex+s*10, ey-es*2.1); ctx.stroke(); } }
    if (worry>0.6){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0, ey+30, 7, 9, 0, 0, 7); ctx.fill(); }
    if (worry>0.55){ const dy=(frame*2)%22, sx2=58, sy=ey-30+dy; ctx.fillStyle='rgba(126,224,255,0.95)'; ctx.beginPath(); ctx.moveTo(sx2,sy-10); ctx.quadraticCurveTo(sx2-8,sy+4,sx2,sy+6); ctx.quadraticCurveTo(sx2+8,sy+4,sx2,sy-10); ctx.fill(); }
  }
  ctx.restore();
}
function geyserFx(round, tb){
  const R=rng(round.start*7919+21), g=2200;
  // jato
  const hgt = Math.min(1, tb/0.12) * (320 - Math.max(0, tb-0.35)*600);
  if (hgt>0){ const top=506-hgt; const jg=ctx.createLinearGradient(0,top,0,506); jg.addColorStop(0,'rgba(243,227,200,0.95)'); jg.addColorStop(1,'rgba(90,42,18,0.95)');
    ctx.fillStyle=jg; ctx.beginPath(); ctx.moveTo(BX-14,506); ctx.lineTo(BX-40,top+30); ctx.quadraticCurveTo(BX,top-30,BX+40,top+30); ctx.lineTo(BX+14,506); ctx.fill(); }
  if (tb<0.07){ ctx.fillStyle=`rgba(255,240,220,${0.35*(1-tb/0.07)})`; ctx.fillRect(0,0,W,H); }
  // tampa voando
  const cy=506-2600*tb+0.5*g*tb*tb, cx=BX-300*tb; ctx.save(); ctx.translate(cx,cy); ctx.rotate(tb*20); ctx.fillStyle='#d62828'; rr(-36,-16,72,32,6); ctx.fill(); ctx.restore();
  // gotas e espuma caindo
  for (let i=0;i<60;i++){ const a=-Math.PI/2+(R()-0.5)*1.4, sp=600+R()*1100, t0=R()*0.3, t=Math.max(0,tb-t0);
    const x=BX+Math.cos(a)*sp*t, y=506-hgt*R()*0.3+Math.sin(a)*sp*t+0.5*g*t*t; if (t<=0 || y>TABLE_Y) continue;
    ctx.fillStyle= i%3 ? 'rgba(110,55,25,0.9)' : 'rgba(243,227,200,0.95)'; ctx.beginPath(); ctx.arc(x,y,3+R()*6,0,7); ctx.fill(); }
  const sk=clamp(tb/0.5,0,1); ctx.fillStyle='rgba(90,42,18,0.8)'; ctx.beginPath(); ctx.ellipse(BX,TABLE_Y+2,90+190*sk,5+4*sk,0,0,7); ctx.fill();
  if (tb<0.32){ const k=tb/0.32, s=1+0.5*k; ctx.save(); ctx.globalAlpha=1-k*k; ctx.translate(BX,720); ctx.scale(s,s); ctx.rotate(-0.08);
    ctx.font='900 92px Inter'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineWidth=12; ctx.strokeStyle='#ff4d5e'; ctx.strokeText(T.fx,0,0); ctx.fillStyle='#fff'; ctx.fillText(T.fx,0,0); ctx.restore(); }
}
function scene(ri, round, lf, e, gold, broke, worry, jitter, frame){
  cloth();
  if (!broke){ const shake = Math.sin(frame*(0.6+1.4*e))*(0.015+0.11*e); bottle(e, letterAt(ri, lf, round.A, frame), worry, frame, shake); }
  else { bottle(0,'',0,0,0,true); geyserFx(round, (lf-round.A)/FPS); }
}
function coverScene(){ cloth(); bottle(1, '', 1, 6, 0.06); }

function sparkles(cx,cy){
  ctx.fillStyle='#fff';
  for (const [dx,dy,s] of [[-250,-80,16],[250,-50,12],[-230,70,10],[245,80,14],[-60,-150,9],[120,-140,11]]){
    const x=cx+dx,y=cy+dy; ctx.beginPath();
    ctx.moveTo(x,y-s); ctx.quadraticCurveTo(x,y,x+s,y); ctx.quadraticCurveTo(x,y,x,y+s); ctx.quadraticCurveTo(x,y,x-s,y); ctx.quadraticCurveTo(x,y,x,y-s); ctx.fill();
  }
}

function goldBanner(idx){
  const x=40,y=500,w=640,h=108;
  ctx.save(); ctx.shadowColor=C.gold; ctx.shadowBlur=30; rr(x,y,w,h,18); ctx.fillStyle='rgba(20,16,4,0.96)'; ctx.fill(); ctx.restore();
  rr(x,y,w,h,18); ctx.strokeStyle=C.gold; ctx.lineWidth=3; ctx.stroke();
  fitText(`${T.gold} ${idx+1}/${WORD.length}`, 360, y+38, 590, 30, C.gold, 900);
  fitText(T.join, 360, y+78, 590, 22, '#ffffff', 800);
}

function outro(f){
  const k = clamp(f/8,0,1);
  ctx.fillStyle=`rgba(4,7,15,${0.88*k})`; ctx.fillRect(0,0,W,H);
  if (k<1) return;
  const pop = 1 + 0.06*Math.sin(f*0.25);
  ctx.save(); ctx.translate(360,520); ctx.scale(pop,pop); fitText(T.q, 0, 0, 620, 54, '#ffffff', 900); ctx.restore();
  fitText(T.hint, 360, 580, 620, 20, C.green, 800);
  const n=WORD.length, sw=74, gap=12, x0=360-(n*sw+(n-1)*gap)/2;
  for(let i=0;i<n;i++){
    const x=x0+i*(sw+gap), y=660, d=clamp((f-10-i*2)/6,0,1);
    ctx.globalAlpha=d; rr(x,y,sw,92,14); ctx.fillStyle=C.surf2; ctx.fill(); ctx.strokeStyle=C.gold; ctx.lineWidth=3; ctx.stroke();
    text('?', x+sw/2, y+48, 48, C.gold, 900); ctx.globalAlpha=1;
  }
  const b = clamp((f-22)/6,0,1); ctx.globalAlpha=b;
  rr(110,820,500,86,43); ctx.fillStyle=C.green; ctx.fill();
  fitText(T.cta, 360, 864, 440, 32, '#04130d', 900);
  text(T.follow, 360, 950, 24, C.text, 600);
  ctx.globalAlpha=1;
}

/* ================= FRAME ================= */
function render(frame){
  ctx.setTransform(S,0,0,S,0,0);
  background(); header();
  let ri = ROUNDS.findIndex(r=>frame<r.end); if (ri<0) ri = ROUNDS.length-1;
  const round = ROUNDS[ri];
  const lf = Math.min(frame, round.end-1) - round.start;
  const gold = lf===round.A, broke = lf>round.A;
  const p = lf/round.A, e = ease(clamp(p,0,1), round.style);
  const ms = (round.A-lf)*1000/FPS;
  const nb = Math.round(BANDS[ri]*e);
  const worry = broke?0:clamp(1-ms/900,0,1);
  const jitter = (!broke && !gold && worry>0.5) ? Math.sin(frame*2.9)*2.5*worry : 0;
  let sx=0, sy=0;
  if (broke){ const tb=(lf-round.A)/FPS; if (tb<0.18){ const R=rng(frame); sx=(R()-0.5)*18*(1-tb/0.18); sy=(R()-0.5)*18*(1-tb/0.18);} }

  ctx.save(); ctx.translate(sx,sy);
  scene(ri, round, lf, e, gold, broke, worry, jitter, frame);
  ctx.restore();

  hud(ri, ms, p, nb, broke, false);

  for(let i=0;i<ROUNDS.length;i++){
    const x=360+(i-(ROUNDS.length-1)/2)*44, y=1110, done=i<ri||(i===ri&&broke), cur=i===ri&&!broke;
    ctx.beginPath(); ctx.arc(x,y,cur?13:10,0,7);
    ctx.fillStyle= done?'rgba(255,77,94,0.85)': cur?C.green:'rgba(255,255,255,0.08)'; ctx.fill();
    if(cur){ ctx.strokeStyle='rgba(0,229,160,0.35)'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(x,y,20,0,7); ctx.stroke(); }
  }
  text(T.items, 360, 1150, 14, 'rgba(136,153,187,0.8)', 800);
  text(BRAND, 360, 1215, 18, 'rgba(232,240,254,0.4)', 800);
  if (frame>=OUTRO_START) outro(frame-OUTRO_START);
}

/* ================= CAPA ================= */
function renderCover(){
  ctx.setTransform(S,0,0,S,0,0);
  background();
  ctx.save(); ctx.translate(0,90);
  coverScene();
  ctx.strokeStyle=C.red; ctx.lineWidth=5; ctx.lineCap='round';
  for (const [x1,y1,x2,y2] of [[130,760,95,735],[590,760,625,735],[120,820,80,820],[600,820,640,820]]){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ctx.translate(360,196); ctx.rotate(-0.04);
  rr(-170,-26,340,52,26); ctx.fillStyle=C.red; ctx.fill(); fitText(T.lvl, 0, 1, 310, 26, '#fff', 900); ctx.restore();
  ctx.save(); ctx.shadowColor='rgba(245,200,66,0.6)'; ctx.shadowBlur=30;
  fitText(T.c1, 360, 300, 640, 118, C.gold, 900); ctx.restore();
  fitText(T.c2, 360, 392, 640, 62, '#ffffff', 900);
  ctx.save(); ctx.translate(360,560); ctx.rotate(-0.03);
  rr(-200,-44,400,88,22); ctx.fillStyle='rgba(8,18,20,0.95)'; ctx.fill(); ctx.strokeStyle=C.green; ctx.lineWidth=3; ctx.stroke();
  text('60', -105, 0, 50, C.gold, 900); fitText(T.bands, 55, 0, 200, 30, '#fff', 900); ctx.restore();
  rr(120,1150,480,80,40); ctx.fillStyle=C.green; ctx.fill();
  fitText(T.c3, 360, 1191, 440, 28, '#04130d', 900);
  return cv.toDataURL('image/png');
}

window.TOTAL_FRAMES = TOTAL_FRAMES; window.ROUNDS = ROUNDS; window.OUTRO_START = OUTRO_START; window.META = { theme:'refri', total: TOTAL_FRAMES, rounds: ROUNDS, outro: OUTRO_START, events: EVENTS };
window.renderFrame = f => { render(f); return cv.toDataURL('image/png'); };
window.renderCover = renderCover;

if (!location.search.includes('export')){
  let f=0, paused=false, last=performance.now(), acc=0;
  const toggle=()=>paused=!paused; cv.addEventListener('click',toggle);
  addEventListener('keydown',e=>{ if(e.code==='Space'){toggle();e.preventDefault();}
    if(paused&&e.code==='ArrowRight'){f=(f+1)%TOTAL_FRAMES;render(f);} if(paused&&e.code==='ArrowLeft'){f=(f-1+TOTAL_FRAMES)%TOTAL_FRAMES;render(f);} });
  document.fonts.ready.then(()=>{ (function loop(now){ acc+=now-last; last=now;
    if(!paused){ while(acc>=1000/FPS){ acc-=1000/FPS; f=(f+1)%TOTAL_FRAMES; } render(f);} else acc=0;
    requestAnimationFrame(loop); })(performance.now()); });
}
