<!doctype html>
<html><head><meta charset="utf-8"><style>@font-face{font-family:Anton;src:url(../fonts/Anton.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="out"></canvas>
<script>
// =====================================================================
//  "PROVA" — vídeo POV olho-de-peixe, estilo cartoon (720x1280, 30fps)
//  renderFrame(t) desenha o quadro do instante t (segundos).
// =====================================================================
const SW = 1080, SH = 1920;      // canvas de origem (antes da lente)
const W = 720, H = 1280;         // saída
const PX = 20;                   // px por grau de câmera
const K = 0.30;                  // força do olho-de-peixe
const DURATION = 80.5;

const src = document.createElement('canvas'); src.width = SW; src.height = SH;
const c = src.getContext('2d');
const out = document.getElementById('out'); out.width = W; out.height = H;
const o = out.getContext('2d');
const outImg = o.createImageData(W, H);

// ---------- mapa da lente (barril + vinheta), pré-calculado ----------
const N = W * H;
const IDX = new Int32Array(N), FX = new Float32Array(N), FY = new Float32Array(N), VIG = new Float32Array(N);
(function buildLens() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    const dx = (x + 0.5 - W / 2) / 640, dy = (y + 0.5 - H / 2) / 640;
    const r2 = dx * dx + dy * dy, f = 1 + K * r2;
    const sx = SW / 2 + dx * f * 640 - 0.5, sy = SH / 2 + dy * f * 640 - 0.5;
    const x0 = Math.floor(sx), y0 = Math.floor(sy);
    if (x0 < 0 || y0 < 0 || x0 >= SW - 1 || y0 >= SH - 1) { IDX[i] = -1; continue; }
    IDX[i] = (y0 * SW + x0) * 4; FX[i] = sx - x0; FY[i] = sy - y0;
    const r = Math.sqrt(r2);
    VIG[i] = Math.max(0, Math.min(1, 1 - 0.75 * Math.pow(Math.max(0, r - 0.72) / 0.6, 1.6)));
  }
})();
function applyLens() {
  const sd = c.getImageData(0, 0, SW, SH).data, od = outImg.data, row = SW * 4;
  for (let i = 0, j = 0; i < N; i++, j += 4) {
    const s = IDX[i];
    if (s < 0) { od[j] = od[j + 1] = od[j + 2] = 0; od[j + 3] = 255; continue; }
    const fx = FX[i], fy = FY[i], v = VIG[i];
    for (let ch = 0; ch < 3; ch++) {
      const p = s + ch;
      const a = sd[p] + (sd[p + 4] - sd[p]) * fx;
      const b = sd[p + row] + (sd[p + row + 4] - sd[p + row]) * fx;
      od[j + ch] = (a + (b - a) * fy) * v;
    }
    od[j + 3] = 255;
  }
  o.putImageData(outImg, 0, 0);
}

// ---------------------------- utilidades ----------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
function rnd(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const INK = '#1b1b1f', LW = 6;
function path(fill, build, lw = LW, stroke = INK) {
  c.beginPath(); build(); if (fill) { c.fillStyle = fill; c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = stroke; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
}
const poly = (pts, fill, lw) => path(fill, () => { c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }, lw);
const rect = (x, y, w, h, fill, lw) => path(fill, () => c.rect(x, y, w, h), lw);
const rrect = (x, y, w, h, r, fill, lw) => path(fill, () => c.roundRect(x, y, w, h, r), lw);
const circ = (x, y, r, fill, lw) => path(fill, () => c.arc(x, y, r, 0, Math.PI * 2), lw);
const ell = (x, y, rx, ry, fill, lw, rot = 0) => path(fill, () => c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2), lw);
function line(x1, y1, x2, y2, lw = LW, col = INK) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineWidth = lw; c.strokeStyle = col; c.lineCap = 'round'; c.stroke(); }
function text(s, x, y, size, col, opts = {}) {
  c.save(); c.font = `${opts.weight || 'bold'} ${size}px ${opts.font || '"DejaVu Sans"'}`;
  c.textAlign = opts.align || 'center'; c.textBaseline = 'middle';
  if (opts.rot) { c.translate(x, y); c.rotate(opts.rot); x = 0; y = 0; }
  if (opts.outline) { c.lineWidth = opts.outline; c.strokeStyle = opts.oc || INK; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y); c.restore();
}

// ------------------------------ elenco ------------------------------
const SKIN = { pov: '#b97a4e', leo: '#f0c39a', bia: '#8a5a3c', prof: '#e8b48c', davi: '#d49a6a', z: '#93a98a', z2: '#a3a37c', s1: '#f1c7a1', s2: '#6e4630', s3: '#c98f63' };

// person(): âncora no quadril (0,0). Cabeça em (0,-290).
function person(x, y, s, p) {
  c.save(); c.translate(x, y); c.scale(s, s); if (p.rot) c.rotate(p.rot);
  const skin = p.skin, shirt = p.shirt || '#f2f2f2';
  if (p.standing) {
    const st = p.step || 0;
    rrect(-62 + st * 6, -5, 54, 215 - st * 10, 14, p.pants || '#2c3550');
    rrect(8 - st * 6, -5, 54, 215 + st * 10, 14, p.pants || '#2c3550');
    ell(-36 + st * 6, 214 - st * 8, 42, 20, '#222');
    ell(36 - st * 6, 218 + st * 8, 42, 20, '#222');
  }
  if (p.hair === 'long') path(p.hairCol, () => { c.roundRect(-78, -350, 156, 230, 60); });
  // braços atrás do tronco
  const arm = (side, pose) => {
    const sx = side * 82;
    if (pose === 'down') { path(shirt, () => c.roundRect(sx - 22 + side * 6, -205, 44, 120, 20)); rrect(sx - 18 + side * 12, -95, 36, 90, 16, p.sleeveSkin ? skin : skin); circ(sx + side * 14, -2, 22, skin); }
  };
  const L = p.armL || 'down', R = p.armR || 'down';
  if (!p.zarms) { if (!p.handUp) arm(-1, L); arm(1, R); }
  // tronco
  path(shirt, () => { c.moveTo(-84, -170); c.quadraticCurveTo(-84, -215, -40, -218); c.lineTo(40, -218); c.quadraticCurveTo(84, -215, 84, -170); c.lineTo(74, 12); c.lineTo(-74, 12); c.closePath(); });
  if (p.torn) { path('#4b3a2a', () => { c.moveTo(-74, 12); for (let i = 0; i <= 8; i++) c.lineTo(-74 + i * 18.5, i % 2 ? -12 : 10); c.lineTo(74, 12); c.closePath(); }, 3); ell(30, -120, 18, 26, '#6b2d2d', 3); }
  if (p.logo && !p.back) { circ(-40, -160, 14, p.logo, 3); }
  if (p.badge) { rect(28, -170, 34, 22, '#d8c25a', 3); }
  if (p.collar && !p.back) poly([-30, -218, 0, -185, 30, -218], p.collar, 4);
  // pescoço e cabeça
  rect(-22, -248, 44, 36, skin);
  const hy = -290;
  if (!p.back) { ell(-60, hy + 4, 12, 18, skin, 5); ell(60, hy + 4, 12, 18, skin, 5); }
  circ(0, hy, 62, skin);
  const f = (p.face || 0) * 22;
  if (p.back) {
    path(p.hairCol, () => { c.arc(0, hy, 64, Math.PI * 0.95, Math.PI * 2.05); c.lineTo(62, hy + 30); c.quadraticCurveTo(0, hy + 55, -62, hy + 30); c.closePath(); });
    ell(-62, hy + 6, 10, 16, skin, 5); ell(62, hy + 6, 10, 16, skin, 5);
  } else {
    // cabelo
    if (p.hair === 'short') path(p.hairCol, () => { c.arc(0, hy, 64, Math.PI * 1.02, Math.PI * 1.98); c.quadraticCurveTo(30 + f, hy - 40, -10 + f, hy - 30); c.quadraticCurveTo(-40, hy - 30, -62, hy - 6); c.closePath(); });
    if (p.hair === 'curly') { for (let i = 0; i < 9; i++) { const a = Math.PI * (1.0 + i / 8); circ(Math.cos(a) * 58, hy + Math.sin(a) * 58 - 6, 24, p.hairCol, 4); } }
    if (p.hair === 'long') path(p.hairCol, () => { c.arc(0, hy, 66, Math.PI * 1.0, Math.PI * 2.0); c.quadraticCurveTo(10 + f, hy - 30, -66, hy); c.closePath(); });
    if (p.hair === 'bald') { path(p.hairCol, () => { c.ellipse(-56, hy - 6, 12, 26, 0, 0, Math.PI * 2); }); path(p.hairCol, () => { c.ellipse(56, hy - 6, 12, 26, 0, 0, Math.PI * 2); }); }
    if (p.hair === 'cap') { path(p.hairCol, () => { c.arc(0, hy - 8, 64, Math.PI, Math.PI * 2); c.closePath(); }); path(p.hairCol, () => { c.ellipse(f + 30, hy - 10, 60, 13, 0, 0, Math.PI * 2); }); }
    // rosto
    const ex = p.expr || 'neutral', ey = hy - 6;
    if (ex === 'zombie') {
      ell(-22 + f, ey, 15, 13, '#f3f0d0', 4); ell(22 + f, ey, 15, 13, '#f3f0d0', 4);
      circ(-22 + f, ey + 1, 3, '#7a1e1e', 0); circ(22 + f, ey + 1, 3, '#7a1e1e', 0);
      line(-38 + f, ey - 20, -8 + f, ey - 14, 5); line(38 + f, ey - 20, 8 + f, ey - 14, 5);
      const mo = 14 + (p.mouth || 0) * 18;
      path('#3a0f0f', () => { c.ellipse(f, hy + 34, 20, mo, 0, 0, Math.PI * 2); }, 5);
      for (let i = -1; i <= 1; i++) rect(f + i * 10 - 4, hy + 34 - mo + 2, 8, 9, '#eee', 2);
      line(-30 + f, hy + 10, -10 + f, hy + 18, 3, '#5d6d55'); line(40 + f, hy - 40, 26 + f, hy - 28, 3, '#5d6d55');
    } else {
      const big = ex === 'scared' ? 1.25 : 1;
      ell(-22 + f, ey, 12 * big, 15 * big, '#fff', 4); ell(22 + f, ey, 12 * big, 15 * big, '#fff', 4);
      const pd = ex === 'scared' ? 4 : 7, lk = (p.look || 0) * 4;
      circ(-22 + f + lk, ey + 2, pd, INK, 0); circ(22 + f + lk, ey + 2, pd, INK, 0);
      if (ex === 'angry') { line(-40 + f, ey - 30, -10 + f, ey - 20, 6); line(40 + f, ey - 30, 10 + f, ey - 20, 6); }
      else if (ex === 'scared') { line(-38 + f, ey - 30, -10 + f, ey - 36, 6); line(38 + f, ey - 30, 10 + f, ey - 36, 6); }
      else { line(-36 + f, ey - 28, -10 + f, ey - 28, 6); line(36 + f, ey - 28, 10 + f, ey - 28, 6); }
      if (p.glasses) { c.save(); c.lineWidth = 4; c.strokeStyle = INK; c.beginPath(); c.roundRect(-44 + f, ey - 16, 40, 32, 8); c.roundRect(4 + f, ey - 16, 40, 32, 8); c.moveTo(-4 + f, ey - 4); c.lineTo(4 + f, ey - 4); c.stroke(); c.restore(); }
      if (p.mustache) path(p.hairCol, () => { c.ellipse(f, hy + 22, 24, 8, 0, 0, Math.PI * 2); }, 3);
      line(f + 2, hy + 2, f + 6, hy + 12, 4);
      const m = p.mouth || 0, my = hy + 34;
      if (ex === 'scared' || m > 0.05) path('#5a1a1a', () => c.ellipse(f, my, ex === 'scared' ? 10 + m * 6 : 14, 4 + m * 14 + (ex === 'scared' ? 6 : 0), 0, 0, Math.PI * 2), 4);
      else if (ex === 'angry') line(-14 + f, my + 4, 14 + f, my, 5);
      else { c.beginPath(); c.arc(f, my - 12, 16, Math.PI * 0.25, Math.PI * 0.75); c.lineWidth = 5; c.strokeStyle = INK; c.stroke(); }
      if (p.sweat) { ell(50 + f, hy - 30, 6, 10, '#bfe6ff', 3); }
    }
  }
  // braços na frente do tronco
  if (R === 'point') { path(shirt, () => { c.moveTo(60, -200); c.lineTo(160, -250); c.lineTo(175, -215); c.lineTo(78, -150); c.closePath(); }); circ(185, -240, 24, skin); line(195, -245, 225, -262, 12, INK); line(195, -245, 225, -262, 6, skin); }
  if (L === 'cross' || R === 'cross') { path(shirt, () => c.roundRect(-80, -120, 160, 46, 22)); circ(-70, -98, 20, skin); circ(70, -98, 20, skin); }
  if (p.zarms) {
    const zarm = (side, w) => {
      path(shirt, () => { c.moveTo(side * 58, -216); c.lineTo(side * 106, -204); c.lineTo(side * 110, -150 + w); c.lineTo(side * 66, -146 + w); c.closePath(); });
      path(skin, () => c.roundRect(side > 0 ? 66 : -108, -158 + w, 42, 46, 14));
      c.save(); c.translate(side * 86, -104 + w); c.rotate(Math.PI + side * 0.12); zhand(0, 0, 0.95, skin); c.restore();
    };
    zarm(-1, Math.sin(p.zt * 3) * 8); zarm(1, Math.cos(p.zt * 3) * 8);
  }
  if (p.handUp) { path(shirt, () => c.roundRect(-122, -330, 46, 150, 20)); rrect(-118, -400, 38, 90, 16, skin); path(skin, () => c.roundRect(-128, -462, 58, 70, 22)); for (let i = 0; i < 4; i++) rrect(-128 + i * 15, -500 + Math.abs(i - 1.5) * 5, 13, 44, 6, skin, 4); }
  if (p.desk) desk(0, 30, 1.05);
  c.restore();
}
function zhand(x, y, s, col = SKIN.z) {
  c.save(); c.translate(x, y); c.scale(s, s);
  for (let i = 0; i < 4; i++) rrect(-24 + i * 13, -48 - (i === 1 || i === 2 ? 8 : 0), 12, 40, 6, col, 4);
  rrect(-28, -20, 54, 44, 16, col, 5); rrect(22, -16, 12, 30, 6, col, 4);
  c.restore();
}
function desk(x, y, s) { // mesa escolar vista de frente
  c.save(); c.translate(x, y); c.scale(s, s);
  rect(-120, 30, 12, 160, '#8f969c', 4); rect(108, 30, 12, 160, '#8f969c', 4);
  poly([-150, 0, 150, 0, 140, 34, -140, 34], '#d9a86c');
  rect(-140, 34, 280, 10, '#a8763f', 4);
  c.restore();
}
function chairBack(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); rrect(-80, -60, 160, 70, 16, '#3a6fb0'); rect(-70, 10, 10, 90, '#8f969c', 4); rect(60, 10, 10, 90, '#8f969c', 4); c.restore(); }

// mãos em primeira pessoa (coord. de tela de origem)
function povArm(x, y, ang, s, kind, sleeve = '#2f62a8') {
  c.save(); c.translate(x, y); c.rotate(ang); c.scale(s, s);
  path(sleeve, () => { c.moveTo(-70, 60); c.lineTo(70, 60); c.lineTo(90, 900); c.lineTo(-90, 900); c.closePath(); });
  rect(-74, 50, 148, 34, '#264f88', 5);
  const sk = SKIN.pov;
  if (kind === 'pencil') {
    poly([-6, -150, 10, -150, 26, 30, 8, 34], '#f2c230', 5); poly([-6, -150, 10, -150, 2, -185], '#f1d6ad', 4); poly([0, -172, 6, -172, 2, -185], INK, 0);
    rrect(-62, -40, 120, 100, 40, sk);
    for (let i = 0; i < 3; i++) rrect(-56 + i * 30, -70 + i * 6, 30, 70, 14, sk, 5);
    rrect(28, -60, 30, 64, 14, sk, 5);
  } else if (kind === 'flat') {
    rrect(-66, -60, 132, 120, 40, sk);
    for (let i = 0; i < 4; i++) rrect(-62 + i * 32, -140 + Math.abs(i - 1.5) * 10, 28, 100, 14, sk, 5);
    rrect(50, -60, 30, 80, 14, sk, 5);
  } else if (kind === 'reach') {
    rrect(-66, -70, 132, 130, 40, sk);
    for (let i = 0; i < 4; i++) rrect(-62 + i * 32, -170 + Math.abs(i - 1.5) * 12, 28, 120, 14, sk, 5);
    rrect(-90, -70, 34, 90, 16, sk, 5);
  } else if (kind === 'phone') {
    rrect(-80, -40, 160, 110, 40, sk);
  }
  c.restore();
}

// ------------------------------ câmera ------------------------------
const KNOCKS = [50.3, 50.6, 50.9, 54.0, 54.3, 54.6, 57.5, 57.8, 58.1, 59.6, 59.8, 60.0, 60.2, 60.4, 60.6, 60.8, 61.0, 61.2];
// keyframes [t, yaw, pitch]
const CAM = [[0, 0, 50], [3.6, 0, 50], [4.4, 50, 8], [9.6, 50, 8], [10.3, 4, 4], [14.0, 4, 4], [14.8, 2, 12], [16.5, 2, 12], [16.85, 3, 2], [21.4, 3, 2], [22.2, 0, -28], [25.9, 0, -28], [26.5, 3, 0], [27.2, 3, 0], [28.2, -58, -2], [33.5, -58, -2], [51.8, 32, 2], [59.8, 32, 2]];
function camAt(t) {
  for (let i = 0; i < CAM.length - 1; i++) { const a = CAM[i], b = CAM[i + 1]; if (t <= b[0]) { const k = ease(prog(t, a[0], b[0])); return { yaw: lerp(a[1], b[1], k), pitch: lerp(a[2], b[2], k) }; } }
  const l = CAM[CAM.length - 1]; return { yaw: l[1], pitch: l[2] };
}
function shakeAt(t) {
  let x = Math.sin(t * 1.3) * 6 + Math.sin(t * 2.7) * 4, y = Math.sin(t * 1.7) * 5 + Math.cos(t * 0.9) * 4; // respiração
  const hit = (te, amp, dec) => { if (t < te) return; const e = amp * Math.exp(-(t - te) * dec); x += Math.sin(t * 63) * e; y += Math.cos(t * 71) * e; };
  hit(16.5, 70, 3); hit(47.4, 40, 5); hit(48.0, 40, 5); hit(48.8, 45, 5); hit(49.7, 50, 4); hit(24.6, 18, 4);
  if (t > 52 && t < 55.4) { x += Math.sin(t * 9) * 10; y += Math.abs(Math.sin(t * 4.5)) * 18; }
  KNOCKS.forEach(te => hit(te + 10.4, 22, 9));
  if (t > 42.6 && t < 47.2) { const v = (Math.floor(t * 2) % 2 === 0) ? 6 : 0; x += Math.sin(t * 90) * v; }
  return { x, y };
}

// ---------------------------- SALA DE AULA ----------------------------
function classroom(t) {
  const cam = camAt(t), sh = shakeAt(t);
  c.save(); c.translate(SW / 2 + sh.x, SH / 2 + sh.y); c.translate(-cam.yaw * PX, -cam.pitch * PX);
  const flick = (t > 16.5 && t < 17.9 && Math.floor(t * 14) % 3 === 0) ? 0.55 : 1;
  // teto
  rect(-3200, -2600, 6400, 2100, '#dcd9cf', 0);
  for (let i = -16; i <= 16; i++) line(i * 200, -2600, i * 140, -560, 3, '#b9b5a8');
  for (let j = 0; j < 6; j++) line(-3200, -600 - j * j * 60 - j * 60, 3200, -600 - j * j * 60 - j * 60, 3, '#b9b5a8');
  for (let i = -2; i <= 2; i++) for (let j = 0; j < 2; j++) { const y = -760 - j * 420, w = 110 + j * 40; rrect(i * 480 - w, y, w * 2, 34 + j * 14, 8, flick < 1 ? '#9a9a8c' : '#fffbe6', 5); }
  // chão
  rect(-3200, 230, 6400, 2400, '#bfb8a6', 0);
  for (let i = -20; i <= 20; i++) line(i * 160, 230, i * 420, 2600, 3, '#a59d88');
  for (let j = 1; j < 10; j++) line(-3200, 230 + j * j * 22, 3200, 230 + j * j * 22, 3, '#a59d88');
  // paredes laterais
  const side = (dir) => {
    const a = dir * 900, b = dir * 3200;
    poly([a, -560, b, -1700, b, 1300, a, 240], '#efe4bf', 5);
    poly([a, 60, b, 450, b, 1300, a, 240], '#3f8f60', 5);
  };
  side(-1); side(1);
  // parede da frente
  rect(-900, -560, 1800, 800, '#efe4bf', 5);
  rect(-900, 60, 1800, 180, '#3f8f60', 5);
  // janelas (esquerda)
  [[-1120, -1500], [-1700, -2150]].forEach(([x1, x2]) => {
    const yt = x => -470 + (x + 900) * 0.6 * 0.95, yb = x => 30 - (x + 900) * 0.18;
    const sky = c.createLinearGradient(0, -1200, 0, 200); sky.addColorStop(0, '#79b8ec'); sky.addColorStop(1, '#cfe9fb');
    poly([x1, yt(x1), x2, yt(x2), x2, yb(x2), x1, yb(x1)], sky, 7);
    c.save(); c.beginPath(); c.moveTo(x1, yt(x1)); c.lineTo(x2, yt(x2)); c.lineTo(x2, yb(x2)); c.lineTo(x1, yb(x1)); c.closePath(); c.clip();
    for (let k = 0; k < 4; k++) circ(x1 + (x2 - x1) * (0.2 + k * 0.25), yb(x1) - 60 - k * 10, 90, '#4f9a4a', 5);
    rect(Math.min(x1, x2), yb(x1) - 30, Math.abs(x2 - x1), 400, '#b7b2a6', 4);
    c.restore();
    const xm = (x1 + x2) / 2; line(xm, yt(xm), xm, yb(xm), 10, '#c9ccd0'); line(xm, yt(xm), xm, yb(xm), 3, INK);
  });
  // mural (direita)
  poly([1150, -420, 1700, -680, 1700, -60, 1150, -40], '#c79a5d');
  [[1220, -380, '#ffe47a'], [1400, -470, '#9fd3ff'], [1260, -200, '#ffb3c7'], [1480, -260, '#c8f2a8']].forEach(([x, y, col], i) => poly([x, y, x + 140, y - 20, x + 140, y + 110, x, y + 120], col, 4));
  // relógio
  circ(-720, -420, 70, '#fff'); circ(-720, -420, 6, INK, 0);
  const sec = t * Math.PI * 2 / 60; line(-720, -420, -720 + Math.sin(sec * 60 / 60 * 6.0) * 50, -420 - Math.cos(sec * 6) * 50, 3, '#c22');
  line(-720, -420, -680, -440, 6); line(-720, -420, -720, -470, 5);

  if (t > 54.2 && t < 57.4) { const k = ease(prog(t, 54.2, 54.6)); povArm(-60 + k * 200, 1650 - k * 260, 0.75, 1.4, 'flat', '#f4f4f4'); }
}

const SUBS = [

const COL = { 'VOCÊ': '#ffffff', 'LÉO': '#ffd23f', 'PROFESSOR': '#ff9a62', 'BIA': '#d4b3ff', 'DAVI': '#7fe3ff', 'ALTO-FALANTE': '#9df29d' };
const SFX = [[16.5, 17.8, 'BUM!'], [24.6, 25.7, 'AAAAAH!'], [47.4, 48.6, 'PÁ! PÁ!'], [52.1, 53.2, 'RRRRRSHHH'], [56.6, 57.3, 'CLIC'], [60.65, 61.5, 'TOC TOC TOC'], [67.9, 68.7, 'TOC TOC'], [70.0, 71.8, 'BAM! BAM! BAM!']];
function wrap(s, max) { const w = s.split(' '); const lines = []; let cur = ''; o.font = 'bold 34px "DejaVu Sans"'; for (const x of w) { const tr = cur ? cur + ' ' + x : x; if (o.measureText(tr).width > max && cur) { lines.push(cur); cur = x; } else cur = tr; } lines.push(cur); return lines; }
function otext(s, x, y, size, col, ow = 7, align = 'center') { o.font = `bold ${size}px "DejaVu Sans"`; o.textAlign = align; o.textBaseline = 'middle'; o.lineJoin = 'round'; o.lineWidth = ow; o.strokeStyle = '#000'; o.strokeText(s, x, y); o.fillStyle = col; o.fillText(s, x, y); }
function overlay(t) {
  // gancho
  if (t < 3.6) { const a = Math.min(1, t / 0.3, (3.6 - t) / 0.4); o.globalAlpha = a; o.fillStyle = '#ffd23f'; o.beginPath(); o.roundRect(70, 110, 580, 120, 18); o.fill(); o.lineWidth = 6; o.strokeStyle = '#000'; o.stroke();
    o.fillStyle = '#000'; o.font = 'bold 34px "DejaVu Sans"'; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillText('POV: você tá fazendo prova', 360, 150); o.fillText('quando tudo começa...', 360, 192); o.globalAlpha = 1; }
  // banner de alerta
  if (t > 42.7 && t < 51.4) { const a = Math.min(1, (t - 42.7) / 0.3, (51.4 - t) / 0.4); o.globalAlpha = a; o.fillStyle = Math.floor(t * 3) % 2 ? '#c41d1d' : '#e02828'; o.beginPath(); o.roundRect(40, 60, 640, 110, 14); o.fill(); o.lineWidth = 5; o.strokeStyle = '#fff'; o.stroke();
    o.fillStyle = '#fff'; o.beginPath(); o.moveTo(100, 82); o.lineTo(140, 148); o.lineTo(60, 148); o.closePath(); o.fill(); o.fillStyle = '#c41d1d'; o.font = 'bold 44px "DejaVu Sans"'; o.textAlign = 'center'; o.fillText('!', 100, 125);
    o.fillStyle = '#fff'; o.textAlign = 'left'; o.font = 'bold 24px "DejaVu Sans"'; o.fillText('ALERTA EXTREMO • DEFESA CIVIL', 170, 92); o.font = 'bold 36px "DejaVu Sans"'; o.fillText('FIQUE EM LOCAL FECHADO', 170, 138); o.globalAlpha = 1; }
  // efeitos sonoros escritos
  for (const [a, b, s] of SFX) if (t >= a && t <= b) { const k = prog(t, a, a + 0.15), sc = lerp(1.6, 1, k); o.save(); o.translate(360 + Math.sin(t * 50) * 6, 470); o.rotate(-0.08); o.scale(sc, sc); otext(s, 0, 0, s.length > 8 ? 62 : 96, '#ffe14d', 14); o.restore(); }
  // falas
  for (const [a, b, who, s] of SUBS) if (t >= a && t <= b) {
    const al = Math.min(1, (t - a) / 0.12, (b - t) / 0.12); o.globalAlpha = al;
    const lines = wrap(s, 600), y0 = (t > 42.6 && t < 47.4 ? 1110 : 880) - (lines.length - 1) * 22;
    otext(who, 360, y0 - 52, 22, COL[who], 6);

}
function endScreen(t) {
  t -= 10.4;

    o.fillStyle = col; o.beginPath(); o.roundRect(-250, -62, 500, 124, 18); o.fill(); o.lineWidth = 6; o.strokeStyle = '#fff'; o.stroke();
    icon(-185, 0); otext(label1, -120, -20, 38, '#fff', 6, 'left'); otext(label2, -120, 24, 38, '#fff', 6, 'left'); o.restore(); };
  btn(640, '#c62828', 'ABRIR', 'A PORTA', 63.6, (x, y) => { o.fillStyle = '#a0662f'; o.fillRect(x - 24, y - 40, 48, 80); o.strokeStyle = '#000'; o.lineWidth = 4; o.strokeRect(x - 24, y - 40, 48, 80); o.fillStyle = '#ffd23f'; o.beginPath(); o.arc(x + 12, y, 6, 0, 7); o.fill(); });
  btn(800, '#1f6fb2', 'DEIXAR', 'FECHADA', 63.9, (x, y) => { o.fillStyle = '#ffd23f'; o.strokeStyle = '#000'; o.lineWidth = 5; o.beginPath(); o.arc(x, y - 12, 18, Math.PI, 0); o.stroke(); o.fillRect(x - 26, y - 12, 52, 44); o.strokeRect(x - 26, y - 12, 52, 44); });
  o.save(); o.globalAlpha = pop(64.4); otext('Comenta aqui', 340, 950, 40, '#ffd23f', 7);
  const by = 1010 + Math.abs(Math.sin(t * 4)) * 18; o.fillStyle = '#ffd23f'; o.strokeStyle = '#000'; o.lineWidth = 5; o.beginPath(); o.moveTo(470, by - 40); o.lineTo(470, by); o.lineTo(452, by); o.lineTo(480, by + 34); o.lineTo(508, by); o.lineTo(490, by); o.lineTo(490, by - 40); o.closePath(); o.stroke(); o.fill();
  o.restore();
}

// ---------------------------- quadro final ----------------------------
function renderFrame(t) {
  c.save(); c.fillStyle = '#000'; c.fillRect(0, 0, SW, SH);
  if (t < 33.0) classroom(t);
  else if (t < 47.35) { windowSet(t); phoneOverlay(t); }
  else if (t < 51.8) glassAttack(t);
  else if (t < 59.8) classroom(t);
  else if (t < 73.2) doorSet(t);
  else doorSet(73.2);
  // transições "chicote"
  const whip = (a) => { const d = Math.abs(t - a); if (d < 0.22) { const k = 1 - d / 0.22; c.save(); c.globalAlpha = 0.85 * k; c.filter = 'blur(18px)'; c.drawImage(src, -140 * k, 0); c.drawImage(src, 140 * k, 0); c.restore(); } };
  whip(33.0); whip(47.35); whip(51.8); whip(59.8);
  // flash do estrondo
  if (t > 16.5 && t < 16.85) { c.fillStyle = `rgba(255,255,240,${0.8 * (1 - (t - 16.5) / 0.35)})`; c.fillRect(0, 0, SW, SH); }
  // fade de entrada
  if (t < 0.4) { c.fillStyle = `rgba(0,0,0,${1 - t / 0.4})`; c.fillRect(0, 0, SW, SH); }
  c.restore();
  applyLens();
  overlay(t);
  endScreen(t);
  return out.toDataURL('image/jpeg', 0.9);
}

// texto estilo capa: fonte condensada, contorno grosso e sombra
function ctext(str, x, y, size, fill, rot = 0) {
  o.save(); o.translate(x, y); o.rotate(rot);

  o.lineWidth = size * 0.2; o.strokeStyle = '#000'; o.strokeText(str, 5, 6);

}
function banner(str, x, y, w, h, size, rot) {

}

  g = o.createLinearGradient(0, 760, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.8)'); o.fillStyle = g; o.fillRect(0, 760, W, H - 760);
