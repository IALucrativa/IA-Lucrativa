<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Grande Golpe</title>
<style>
  html,body{margin:0;background:#120821;height:100%;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ================= CONFIG / TEXTOS ================= */
const FPS = 30, BRAND = '@vocedecideai.br';
const F_HOOK = 45, F_DRIVE = 45, F_BOARD = 160, F_CYCLE = 220, F_COUNT = 300, CLUE = 330, F_VOTE = 375, TOTAL_FRAMES = 540;
const TRAP = 2;                                         // plano 3 (telhado) e a armadilha
const PLANS = [
  { n:'PELA FRENTE',  risk:'RISCO: ALTO',  rc:'#ff4d6d' },
  { n:'PELO ESGOTO',  risk:'RISCO: ???',   rc:'#b9b9d6' },
  { n:'PELO TELHADO', risk:'RISCO: BAIXO', rc:'#3cf0a0' },
];
const T = {
  hook1:'O COFRINHO VAI', hook2:'ASSALTAR O BANCO', hook3:'E VOCÊ DECIDE O PLANO',
  mission:'MISSÃO 1', title:'O GRANDE GOLPE',
  m1:['OBJETIVO: ROUBAR O COFRE', 'DO BANCO CENTRAL DA ORLA.'],
  m2:['ESCOLHA O PLANO. MAS CUIDADO:', 'UM DELES É UMA ARMADILHA.'],
  hack:'HACKEANDO CÂMERAS', hackHint:'PAUSE NO 100% E VEJA AS CÂMERAS',
  ready:'PREPARA PRA PAUSAR!', missed:['PERDEU AS CÂMERAS?', 'VOLTA E PAUSA NO 100%!'],
  board:'PLANO DO GOLPE',
};

/* ================= HELPERS ================= */
const W = 720, H = 1280;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const S = cv.width / W;
const C = { pink:'#ff3da5', hot:'#ff4d6d', cyan:'#2de2e6', yellow:'#ffd23f', orange:'#ff9f43', purple:'#7b2cbf', deep:'#120821', white:'#ffffff', green:'#3cf0a0', muted:'#b9b9d6' };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=p=>1-Math.pow(1-clamp(p,0,1),3);
const back=p=>{ p=clamp(p,0,1); const c=1.7; return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2); };
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function text(s,x,y,size,color,weight=900,align='center',font='Inter'){ ctx.font=`${weight} ${size}px ${font}`; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
function fitText(s,x,y,maxW,size,color,weight=900,align='center'){ ctx.font=`${weight} ${size}px Inter`; const w=ctx.measureText(s).width; if(w>maxW) size*=maxW/w; text(s,x,y,size,color,weight,align); }
function neon(s,x,y,size,col,glow,maxW=660){ ctx.font=`900 ${size}px Inter`; let w=ctx.measureText(s).width; if(w>maxW){ size*=maxW/w; ctx.font=`900 ${size}px Inter`; }
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.save(); ctx.shadowColor=glow; ctx.shadowBlur=24; ctx.lineWidth=size*0.12; ctx.strokeStyle=glow; ctx.strokeText(s,x,y);
  ctx.fillStyle=col; ctx.fillText(s,x,y); ctx.restore(); }

/* ================= COFRINHO (mesmo personagem da serie) ================= */
const TABLE_Y = 968;
function pig(cx, gold, letter, worry, t){
  const by = 870;      // centro do corpo
  ctx.save();
  // sombra
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(cx, TABLE_Y+2, 135, 12, 0, 0, 7); ctx.fill();
  const body = gold ? ['#fff2a8','#f5c842','#b8860b'] : ['#ffc4d6','#ff8fb1','#d9577f'];
  const edge = gold ? '#8a6200' : '#b8466a';
  // pernas
  ctx.fillStyle = gold ? '#d9a520' : '#f07aa0';
  for (const lx of [-78,-42,40,76]) { rr(cx+lx-14, by+40, 28, TABLE_Y-(by+40), 8); ctx.fill(); }
  // rabo
  ctx.strokeStyle=body[2]; ctx.lineWidth=5; ctx.beginPath();
  for(let a=0;a<=Math.PI*3;a+=0.2){ const r=4+a*2.2; const x=cx-128-r*Math.cos(a), y=by-10-r*Math.sin(a)*0.8; a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();
  // orelha de tras
  ctx.fillStyle=body[2]; ctx.beginPath(); ctx.moveTo(cx+38,by-66); ctx.lineTo(cx+50,by-86); ctx.lineTo(cx+76,by-70); ctx.fill();
  // corpo
  const g=ctx.createRadialGradient(cx-40,by-50,10,cx,by,150); g.addColorStop(0,body[0]); g.addColorStop(.5,body[1]); g.addColorStop(1,body[2]);
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,by,132,78,0,0,7); ctx.fill();
  ctx.strokeStyle=edge; ctx.lineWidth=2.5; ctx.stroke();
  // fenda da moeda
  ctx.fillStyle = gold ? '#7a5600' : '#6b1f3a'; rr(cx-34, by-77, 60, 9, 4); ctx.fill();
  // focinho
  ctx.fillStyle = gold ? '#e8b42a' : '#ff7aa3'; ctx.beginPath(); ctx.ellipse(cx+132,by+8,24,30,0,0,7); ctx.fill();
  ctx.strokeStyle=edge; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle=edge; ctx.beginPath(); ctx.ellipse(cx+136,by-2,4,7,0,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx+136,by+18,4,7,0,0,7); ctx.fill();
  // orelha da frente
  ctx.fillStyle = gold ? '#f0c040' : '#ff9fbd'; ctx.beginPath(); ctx.moveTo(cx+62,by-66); ctx.lineTo(cx+80,by-88); ctx.lineTo(cx+106,by-58); ctx.fill();
  ctx.strokeStyle=edge; ctx.lineWidth=2; ctx.stroke();
  // olho (olha pra cima quando preocupado)
  const ex=cx+92, ey=by-22;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(ex,ey,13,15+worry*3,0,0,7); ctx.fill();
  ctx.fillStyle='#10131c'; ctx.beginPath(); ctx.arc(ex+3-worry*2, ey+4-worry*10, 6.5, 0, 7); ctx.fill();
  if (worry>0.3){ // sobrancelha preocupada
    ctx.strokeStyle=edge; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ex-14,ey-22-worry*4); ctx.lineTo(ex+12,ey-30); ctx.stroke();
  }
  // bochecha
  if(!gold){ ctx.fillStyle='rgba(255,90,140,0.35)'; ctx.beginPath(); ctx.ellipse(cx+90,by+16,16,9,0,0,7); ctx.fill(); }
  // gota de suor
  if (worry>0.55 && !gold){
    const dy = (t*60)%26;
    ctx.fillStyle='rgba(126,224,255,0.9)'; ctx.beginPath(); ctx.moveTo(cx+60,by-60+dy); ctx.quadraticCurveTo(cx+50,by-44+dy,cx+60,by-40+dy); ctx.quadraticCurveTo(cx+70,by-44+dy,cx+60,by-60+dy); ctx.fill();
  }
  // letra dourada
  if (gold){
    ctx.save(); ctx.shadowColor='rgba(90,60,0,0.8)'; ctx.shadowOffsetY=5; ctx.shadowBlur=0;
    text(letter, cx-24, by+8, 104, '#fffbe6', 900); ctx.restore();
    ctx.textAlign='center'; ctx.strokeStyle='rgba(122,86,0,0.6)'; ctx.lineWidth=2; ctx.font='900 104px Inter'; ctx.strokeText(letter,cx-24,by+8);
  }
  ctx.restore();
}

function pigCool(px, py, sc, t){
  ctx.save(); ctx.translate(px, py - 870*sc); ctx.scale(sc,sc);
  pig(0, false, '', 0, t);
  // oculos escuros
  ctx.fillStyle='#111'; rr(60, 834, 64, 26, 10); ctx.fill();
  ctx.fillStyle='rgba(45,226,230,0.75)'; ctx.fillRect(68, 838, 22, 5);
  ctx.strokeStyle='#111'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(60,846); ctx.lineTo(22,838); ctx.stroke();
  ctx.restore();
}

/* ================= CENARIO ================= */
function sky(scroll, alarm=0){
  const g=ctx.createLinearGradient(0,0,0,720); g.addColorStop(0,'#1a0b3d'); g.addColorStop(.45,'#7b2cbf'); g.addColorStop(.75,'#ff3da5'); g.addColorStop(1,'#ff9f43');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,720);
  // sol listrado
  const sy=560; ctx.save(); ctx.beginPath(); ctx.arc(360,sy,170,0,7); ctx.clip();
  const sg=ctx.createLinearGradient(0,sy-170,0,sy+170); sg.addColorStop(0,'#ffe66d'); sg.addColorStop(1,'#ff3da5'); ctx.fillStyle=sg; ctx.fillRect(190,sy-170,340,340);
  for(let i=0;i<8;i++){ const y=sy+10+i*22, h=4+i*2.2; ctx.clearRect(0,0,0,0); ctx.fillStyle='#ff3da5'; ctx.globalAlpha=0.0; ctx.fillRect(0,0,0,0); ctx.globalAlpha=1;
    const g2=ctx.createLinearGradient(0,0,0,720); g2.addColorStop(0,'#1a0b3d'); g2.addColorStop(.45,'#7b2cbf'); g2.addColorStop(.75,'#ff3da5'); g2.addColorStop(1,'#ff9f43');
    ctx.fillStyle=g2; ctx.fillRect(190,y,340,h); }
  ctx.restore();
  // predios
  const r=rng(11); let x=-((scroll*0.25)%60)-60;
  while (x<W+60){ const w=40+Math.floor(r()*50), h=90+Math.floor(r()*200); const top=700-h;
    ctx.fillStyle='#2a0f4f'; ctx.fillRect(x,top,w,h);
    ctx.fillStyle='rgba(255,210,63,0.55)'; for(let yy=top+12; yy<690; yy+=16) for(let xx=x+6; xx<x+w-6; xx+=12) if (r()>0.55) ctx.fillRect(xx,yy,5,7);
    if (r()>0.7){ ctx.fillStyle=C.cyan; ctx.fillRect(x+w/2-1, top-24, 2, 24); }
    x+=w+6; }
  // mar
  const mg=ctx.createLinearGradient(0,700,0,820); mg.addColorStop(0,'#3a1a6b'); mg.addColorStop(1,'#1a0b3d'); ctx.fillStyle=mg; ctx.fillRect(0,700,W,120);
  ctx.fillStyle='rgba(255,159,67,0.55)'; for(let i=0;i<9;i++){ const y=710+i*12, w=240-i*22+Math.sin(scroll*0.05+i)*10; ctx.fillRect(360-w/2,y,w,3); }
  // calcadao + rua
  ctx.fillStyle='#e8c39e'; ctx.fillRect(0,820,W,26);
  ctx.fillStyle='#24203a'; ctx.fillRect(0,846,W,180);
  ctx.fillStyle='#ffd23f'; for(let x2=-((scroll*2)%120); x2<W; x2+=120) ctx.fillRect(x2,934,60,6);
  ctx.fillStyle='#120821'; ctx.fillRect(0,1026,W,254);
  // palmeiras
  for (let k=0;k<4;k++){ const px = ((k*230 - scroll*1.1) % (W+240) + W+240) % (W+240) - 120; palm(px, 846, 1+0.15*(k%2)); }
  if (alarm>0){ const red = Math.floor(alarm*6)%2===0; ctx.fillStyle = red ? 'rgba(255,40,70,0.22)' : 'rgba(45,120,255,0.22)'; ctx.fillRect(0,0,W,H); }
}
function palm(x, base, s){
  ctx.save(); ctx.translate(x,base); ctx.scale(s,s);
  ctx.strokeStyle='#1a0b2e'; ctx.lineWidth=12; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(14,-120,-6,-250); ctx.stroke();
  ctx.fillStyle='#1a0b2e';
  for (let i=0;i<7;i++){ const a=-Math.PI/2 + (i-3)*0.5; ctx.save(); ctx.translate(-6,-250); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(50,-22,110,14); ctx.quadraticCurveTo(50,-4,0,8); ctx.fill(); ctx.restore(); }
  ctx.restore();
}
function car(cx, cy, t, moving){
  ctx.save(); ctx.translate(cx,cy);
  // sombra
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0,64,200,14,0,0,7); ctx.fill();
  // carroceria
  const g=ctx.createLinearGradient(0,-30,0,50); g.addColorStop(0,'#ff6ec7'); g.addColorStop(1,'#c2187a');
  ctx.fillStyle=g; ctx.beginPath();
  ctx.moveTo(-200,10); ctx.quadraticCurveTo(-200,-26,-160,-28); ctx.lineTo(-40,-28); ctx.lineTo(60,-20); ctx.lineTo(170,-8);
  ctx.quadraticCurveTo(205,-2,205,22); ctx.lineTo(205,40); ctx.lineTo(-200,40); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#5a0b3a'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle=C.cyan; ctx.fillRect(-190,6,390,4);
  // para-brisa
  ctx.strokeStyle='rgba(45,226,230,0.9)'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(40,-24); ctx.lineTo(10,-70); ctx.stroke();
  // farol / lanterna
  ctx.fillStyle='#fff6b0'; rr(186,0,16,12,4); ctx.fill(); ctx.fillStyle=C.hot; rr(-200,-6,10,14,3); ctx.fill();
  // rodas
  for (const wx of [-120,120]){ ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(wx,40,32,0,7); ctx.fill();
    ctx.fillStyle='#c9c9e0'; ctx.beginPath(); ctx.arc(wx,40,16,0,7); ctx.fill();
    ctx.strokeStyle='#555'; ctx.lineWidth=3; for(let k=0;k<5;k++){ const a=k/5*Math.PI*2 + (moving? t*14:0); ctx.beginPath(); ctx.moveTo(wx,40); ctx.lineTo(wx+Math.cos(a)*15,40+Math.sin(a)*15); ctx.stroke(); } }
  ctx.restore();
}

/* ================= HUD ================= */
function hud(frame, stars, money, map=true){
  // marca
  rr(24,28,214,44,22); ctx.fillStyle='rgba(18,8,33,0.85)'; ctx.fill(); ctx.strokeStyle=C.pink; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=C.yellow; ctx.beginPath(); ctx.arc(48,50,12,0,7); ctx.fill(); ctx.fillStyle='#120821'; ctx.beginPath(); ctx.moveTo(44,44); ctx.lineTo(44,56); ctx.lineTo(54,50); ctx.fill();
  text('VOCÊ DECIDE', 140, 51, 20, C.white, 900);
  // estrelas de procurado
  for (let i=0;i<5;i++){ const x=470+i*44, y=46, on=i<stars;
    ctx.save(); ctx.translate(x,y); ctx.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, r=k%2?7:17; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); } ctx.closePath();
    ctx.fillStyle = on ? C.yellow : 'rgba(255,255,255,0.12)'; ctx.fill(); ctx.strokeStyle='#120821'; ctx.lineWidth=3; ctx.stroke(); ctx.restore(); }
  text('R$ ' + money.toLocaleString('pt-BR'), 696, 90, 30, C.green, 900, 'right', 'DejaVu Sans Mono');
  if (!map) return;
  // minimapa
  ctx.save(); ctx.beginPath(); ctx.arc(84,150,52,0,7); ctx.fillStyle='rgba(18,8,33,0.85)'; ctx.fill(); ctx.clip();
  ctx.strokeStyle='rgba(255,61,165,0.7)'; ctx.lineWidth=6; const o=(frame*1.2)%40;
  for (let i=-2;i<4;i++){ ctx.beginPath(); ctx.moveTo(32+i*40-o,98); ctx.lineTo(32+i*40-o,202); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(30,150); ctx.lineTo(140,150); ctx.stroke();
  ctx.fillStyle=C.yellow; ctx.beginPath(); ctx.moveTo(84,140); ctx.lineTo(94,160); ctx.lineTo(74,160); ctx.fill();
  ctx.restore(); ctx.strokeStyle=C.cyan; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(84,150,52,0,7); ctx.stroke();
}
function titleBlock(y){
  rr(286,y-24,148,40,10); ctx.fillStyle=C.hot; ctx.fill(); text(T.mission, 360, y-3, 22, C.white, 900);
  neon(T.title, 360, y+56, 66, C.white, C.pink);
}
function missionBox(lines, start, frame, col=C.cyan){
  const x=36,y=1056,w=648,h=124;
  rr(x,y,w,h,18); ctx.fillStyle='rgba(18,8,33,0.9)'; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke();
  let n = Math.floor((frame-start)*1.3);
  lines.forEach((ln,i)=>{ const s=ln.slice(0, clamp(n,0,ln.length)); n-=ln.length; text(s, x+28, y+40+i*44, 30, C.white, 800, 'left'); });
}

/* ================= QUADRO DO PLANO ================= */
function planIcon(i, cx, cy){
  ctx.save(); ctx.translate(cx,cy); ctx.lineWidth=4; ctx.strokeStyle='#222';
  if (i===0){ // fachada do banco
    ctx.fillStyle='#e9e2d0'; ctx.beginPath(); ctx.moveTo(-60,-30); ctx.lineTo(0,-62); ctx.lineTo(60,-30); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillRect(-60,-30,120,82); ctx.strokeRect(-60,-30,120,82);
    ctx.fillStyle='#bdb5a0'; for(const x of [-46,-22,14,38]) ctx.fillRect(x,-24,8,66);
    ctx.fillStyle='#7a4a2a'; ctx.fillRect(-12,8,24,44); text('$', 0, -44, 20, '#222', 900);
  } else if (i===1){ // bueiro
    ctx.fillStyle='#6b6b80'; ctx.beginPath(); ctx.ellipse(0,0,60,34,0,0,7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#3d3d4d'; ctx.lineWidth=3; for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.moveTo(-50,k*10); ctx.lineTo(50,k*10); ctx.stroke(); }
    ctx.fillStyle='#3cf0a0'; ctx.beginPath(); ctx.moveTo(0,40); ctx.lineTo(16,60); ctx.lineTo(-16,60); ctx.fill();
  } else { // helicoptero
    ctx.fillStyle='#2b2d42'; ctx.beginPath(); ctx.ellipse(-6,0,44,26,0,0,7); ctx.fill();
    ctx.fillStyle='#8be9fd'; ctx.beginPath(); ctx.ellipse(16,-4,18,14,0,0,7); ctx.fill();
    ctx.strokeStyle='#2b2d42'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-40,-4); ctx.lineTo(-84,-14); ctx.stroke();
    ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-60,-34); ctx.lineTo(50,-34); ctx.moveTo(-6,-34); ctx.lineTo(-6,-24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-34,34); ctx.lineTo(24,34); ctx.stroke();
  }
  ctx.restore();
}
function board(frame, hi){
  const x=30, y=330, w=660, h=650;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=30;
  rr(x,y,w,h,20); ctx.fillStyle='#b5835a'; ctx.fill(); ctx.restore();
  rr(x,y,w,h,20); ctx.lineWidth=14; ctx.strokeStyle='#5a3a22'; ctx.stroke();
  const r=rng(5); ctx.fillStyle='rgba(90,58,34,0.25)'; for(let i=0;i<260;i++) ctx.fillRect(x+10+r()*(w-20), y+10+r()*(h-20), 3, 3);
  // titulo do quadro
  ctx.save(); ctx.translate(360,y+52); ctx.rotate(-0.02); rr(-170,-26,340,52,6); ctx.fillStyle='#fff8dc'; ctx.fill();
  text(T.board, 0, 2, 30, '#222', 900); ctx.restore();
  // foto do cofre no topo + barbantes
  const vx=360, vy=y+150;
  const px = [140, 360, 580], py = y+400;
  ctx.strokeStyle='#d62828'; ctx.lineWidth=3; for (let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(vx,vy+40); ctx.lineTo(px[i],py-120); ctx.stroke(); }
  ctx.save(); ctx.translate(vx,vy); ctx.rotate(0.03); rr(-70,-50,140,100,4); ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#444b5a'; rr(-54,-38,108,70,6); ctx.fill(); ctx.strokeStyle='#c9c9e0'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,-3,20,0,7); ctx.stroke();
  for(let k=0;k<4;k++){ const a=k*Math.PI/2+frame*0.02; ctx.beginPath(); ctx.moveTo(0,-3); ctx.lineTo(Math.cos(a)*18,-3+Math.sin(a)*18); ctx.stroke(); }
  text('COFRE', 0, 40, 14, '#222', 900); ctx.restore();
  ctx.fillStyle='#d62828'; ctx.beginPath(); ctx.arc(vx,vy-46,7,0,7); ctx.fill();
  // polaroids
  for (let i=0;i<3;i++){
    const on = hi===i, rot=[-0.05,0.02,0.06][i];
    ctx.save(); ctx.translate(px[i], py + (on? -8:0)); ctx.rotate(rot); if(on){ ctx.scale(1.06,1.06); }
    ctx.shadowColor = on ? C.yellow : 'rgba(0,0,0,0.5)'; ctx.shadowBlur = on ? 30 : 14;
    rr(-92,-120,184,250,4); ctx.fillStyle='#fffdf5'; ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#cfe8ff'; ctx.fillRect(-78,-106,156,150); planIcon(i,0,-30);
    text(String(i+1), -60, -84, 34, C.hot, 900);
    fitText(PLANS[i].n, 0, 74, 168, 24, '#222', 900);
    rr(-70,94,140,26,13); ctx.fillStyle=PLANS[i].rc; ctx.fill(); text(PLANS[i].risk, 0, 108, 15, '#120821', 900);
    ctx.restore();
    ctx.fillStyle='#d62828'; ctx.beginPath(); ctx.arc(px[i], py-118, 8, 0, 7); ctx.fill();
  }
}

/* ================= MEDIDOR / CONTAGEM / PISTA ================= */
function hackPct(frame){ if (frame>=CLUE) return frame===CLUE?100:0; const p=clamp((frame-F_BOARD)/(CLUE-F_BOARD),0,1); return Math.min(99, Math.floor(100*(1-Math.pow(1-p,1.7)))); }
function hackMeter(frame){
  const pc=hackPct(frame), x=60, y=246, w=600, h=62, after=frame>CLUE;
  const col = after ? C.hot : pc>=90 ? C.yellow : C.green;
  ctx.save(); ctx.shadowColor=col; ctx.shadowBlur = pc>=90 && !after ? 18+10*Math.sin(frame) : 8;
  rr(x,y,w,h,14); ctx.fillStyle='rgba(10,20,14,0.95)'; ctx.fill(); ctx.restore();
  rr(x,y,w,h,14); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke();
  text(after ? 'CONEXÃO PERDIDA' : T.hack, x+18, y+19, 16, col, 800, 'left', 'DejaVu Sans Mono');
  text(after ? T.missed[1] : T.hackHint, x+w-18, y+19, 13, '#d9ffe9', 700, 'right', 'DejaVu Sans Mono');
  const bx=x+18, by=y+36, bw=w-120, bh=14; rr(bx,by,bw,bh,7); ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fill();
  if (!after && pc>0){ rr(bx,by,Math.max(14,bw*pc/100),bh,7); ctx.fillStyle=col; ctx.fill(); }
  text((after?0:pc)+'%', x+w-18, y+42, 30, col, 900, 'right', 'DejaVu Sans Mono');
}
function countdown(frame){
  const k=frame-F_COUNT, n=3-Math.floor(k/10), local=(k%10)/10, sc=1.3-0.3*easeOut(local*2);
  ctx.fillStyle='rgba(18,8,33,0.55)'; ctx.fillRect(0,330,W,650);
  neon(T.ready, 360, 470, 44, C.white, C.yellow);
  ctx.save(); ctx.translate(360,660); ctx.scale(sc,sc);
  ctx.fillStyle='rgba(18,8,33,0.95)'; ctx.beginPath(); ctx.arc(0,0,120,0,7); ctx.fill();
  ctx.strokeStyle=C.yellow; ctx.lineWidth=8; ctx.beginPath(); ctx.arc(0,0,120,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-local)); ctx.stroke();
  text(String(n), 0, 8, 170, C.white, 900); ctx.restore();
}
function cop(x, y, s){ ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle='#0c1f14';
  ctx.beginPath(); ctx.arc(0,-46,14,0,7); ctx.fill(); rr(-16,-60,32,8,3); ctx.fill(); rr(-20,-32,40,52,10); ctx.fill(); rr(-16,18,12,30,4); ctx.fill(); rr(4,18,12,30,4); ctx.fill();
  ctx.strokeStyle='#0c1f14'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(14,-20); ctx.lineTo(44,-26); ctx.stroke(); ctx.restore(); }
function cctv(frame){
  ctx.fillStyle='#03130b'; ctx.fillRect(0,0,W,H);
  text('● REC', 40, 60, 24, '#ff3b3b', 900, 'left', 'DejaVu Sans Mono');
  text('CÂMERAS HACKEADAS', 680, 60, 22, '#7dffb2', 900, 'right', 'DejaVu Sans Mono');
  text('23:59:59', 680, 92, 18, '#7dffb2', 700, 'right', 'DejaVu Sans Mono');
  // camera grande: telhado
  const x=30,y=130,w=660,h=520;
  ctx.fillStyle='#0b2a18'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#14402a'; ctx.fillRect(x,y+h-150,w,150);           // laje
  ctx.strokeStyle='#2c7a4f'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x+w-150, y+h-210, 70, 0, 7); ctx.stroke(); text('H', x+w-150, y+h-208, 80, '#2c7a4f', 900);
  for (const [cx2,s] of [[140,1.6],[260,1.5],[380,1.6],[500,1.4]]) cop(x+cx2, y+h-120, s);
  ctx.fillStyle='rgba(255,255,140,0.18)'; ctx.beginPath(); ctx.moveTo(x+180,y+h-170); ctx.lineTo(x+420,y+90); ctx.lineTo(x+520,y+120); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.18)'; for(let yy=y; yy<y+h; yy+=5) ctx.fillRect(x,yy,w,2);
  ctx.strokeStyle='#7dffb2'; ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
  text('CAM 03 · TELHADO', x+16, y+26, 18, '#7dffb2', 900, 'left', 'DejaVu Sans Mono');
  ctx.save(); ctx.translate(360, y+80); ctx.rotate(-0.04); rr(-250,-40,500,80,12); ctx.fillStyle='#ff2e4d'; ctx.fill();
  fitText('PLANO 3 = ARMADILHA!', 0, 3, 470, 42, '#fff', 900); ctx.restore();
  text('POLÍCIA ESPERANDO NO TELHADO', 360, y+h-30, 22, '#ffd23f', 900);
  // cameras pequenas sem sinal
  for (let i=0;i<2;i++){ const sx=30+i*340, sy=670, sw=320, sh=200; const r=rng(frame*7+i);
    for(let yy=0; yy<sh; yy+=4) for(let xx=0; xx<sw; xx+=8){ const v=Math.floor(r()*120); ctx.fillStyle=`rgb(${v},${v+20},${v})`; ctx.fillRect(sx+xx,sy+yy,8,4); }
    ctx.strokeStyle='#7dffb2'; ctx.lineWidth=3; ctx.strokeRect(sx,sy,sw,sh);
    text(`CAM 0${i+1} · ${i===0?'ENTRADA':'ESGOTO'}`, sx+12, sy+22, 15, '#7dffb2', 900, 'left', 'DejaVu Sans Mono');
    rr(sx+sw/2-90, sy+sh/2-22, 180, 44, 8); ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fill(); text('SEM SINAL', sx+sw/2, sy+sh/2+1, 24, '#fff', 900); }
  rr(36,900,648,120,18); ctx.fillStyle='rgba(0,30,15,0.95)'; ctx.fill(); ctx.strokeStyle='#7dffb2'; ctx.lineWidth=3; ctx.stroke();
  text('VOCÊ PAUSOU NA HORA CERTA!', 360, 940, 30, '#7dffb2', 900);
  text('AGORA ESCOLHE ENTRE O PLANO 1 E O 2', 360, 984, 24, '#fff', 800);
  text(BRAND, 360, 1240, 18, 'rgba(255,255,255,0.4)', 800);
}

/* ================= TELAS ================= */
function hookScreen(f){
  sky(f*3, f/12);
  pigCool(322, 826, 0.64, f/FPS); car(360, 880, f/FPS, true);
  const p1=back((f+8)/8), p2=back((f+6)/8), p3=back((f+2)/8);
  ctx.fillStyle='rgba(18,8,33,0.35)'; ctx.fillRect(0,80,W,420);
  ctx.save(); ctx.translate(360,180); ctx.scale(p1,p1); neon(T.hook1, 0, 0, 62, C.white, C.pink); ctx.restore();
  ctx.save(); ctx.translate(360,280); ctx.scale(p2,p2); ctx.rotate(-0.04); rr(-330,-52,660,104,16); ctx.fillStyle=C.hot; ctx.fill(); neon(T.hook2, 0, 4, 64, C.white, '#7a0020', 620); ctx.restore();
  if (p3>0){ ctx.save(); ctx.translate(360,390); ctx.scale(p3,p3); neon(T.hook3, 0, 0, 40, C.yellow, C.orange); ctx.restore(); }
  // estrelas acendendo
  hud(f, Math.min(5, 1+Math.floor(f/7)), 0, false);
  text(BRAND, 360, 1240, 18, 'rgba(255,255,255,0.4)', 800);
  if (f>=F_HOOK-3){ ctx.fillStyle=`rgba(255,255,255,${(f-(F_HOOK-4))/4})`; ctx.fillRect(0,0,W,H); }
}

function drivingScene(frame){
  const f = frame - F_DRIVE, moving = frame < F_BOARD - 20;
  const slow = clamp((frame-(F_BOARD-40))/20,0,1);
  sky(f*3*(1-slow*0.8) + slow*0, 0);
  pigCool(322, 826, 0.64, frame/FPS); car(360, 880, frame/FPS, moving);
  hud(frame, 0, 0); titleBlock(260);
  missionBox(T.m1, F_DRIVE+6, frame);
}
function vote(frame){
  const f=frame-F_VOTE;
  ctx.fillStyle='rgba(18,8,33,0.55)'; ctx.fillRect(0,0,W,H);
  board(frame, Math.floor(f/10)%3);
  const p=back(f/10);
  ctx.save(); ctx.translate(360,250); ctx.scale(p,p); rr(-310,-60,620,120,20); ctx.fillStyle=C.hot; ctx.fill();
  neon('VOCÊ DECIDE!', 0, -16, 46, C.white, '#7a0020'); text('COMENTA 1, 2 OU 3', 0, 34, 28, C.yellow, 900); ctx.restore();
  const b=clamp((f-8)/8,0,1); ctx.globalAlpha=b;
  rr(36,1000,648,190,18); ctx.fillStyle='rgba(18,8,33,0.95)'; ctx.fill(); ctx.strokeStyle=C.cyan; ctx.lineWidth=3; ctx.stroke();
  text('O PLANO MAIS COMENTADO ACONTECE NA MISSÃO 2', 360, 1028, 20, C.yellow, 900);
  const pulse=i=>Math.floor((f+i*6)/12)%2===0;
  text('♥  CURTE = DESPISTA A POLÍCIA (-1 ★)', 64, 1072, 24, pulse(0)?C.white:C.pink, 800, 'left');
  text('+  SEGUE = SALVAR O PROGRESSO', 64, 1112, 24, pulse(1)?C.white:C.cyan, 800, 'left');
  text('➤  ENVIA PRO SEU PARCEIRO DO GOLPE', 64, 1152, 24, pulse(2)?C.white:C.green, 800, 'left');
  ctx.globalAlpha=1;
}

/* ================= FRAME ================= */
function render(frame){
  ctx.setTransform(S,0,0,S,0,0);
  if (frame < F_HOOK){ hookScreen(frame); return; }
  if (frame === CLUE){ cctv(frame); return; }
  if (frame < F_BOARD){ drivingScene(frame); text(BRAND, 360, 1240, 18, 'rgba(255,255,255,0.4)', 800); return; }
  // quadro do plano
  sky(0, frame>=F_VOTE ? (frame-F_VOTE)/10 : 0);
  pigCool(322, 826, 0.64, frame/FPS); car(360, 880, frame/FPS, false);
  const stars = frame>=F_VOTE ? 3 : frame>CLUE ? 2 : 0;
  hud(frame, (frame>=F_VOTE && Math.floor(frame/8)%2) ? 2 : stars, 0);
  if (frame >= F_VOTE){ vote(frame); text(BRAND, 360, 1240, 18, 'rgba(255,255,255,0.4)', 800); return; }
  const ap = back((frame-F_BOARD)/12); ctx.save(); ctx.translate(360,655); ctx.scale(ap,ap); ctx.translate(-360,-655);
  let hi=-1; if (frame>=F_CYCLE && frame<F_COUNT){ let f=F_CYCLE, d=16, i=0; while(f<=frame){ hi=i%3; f+=Math.max(4,Math.round(d)); d*=0.88; i++; } }
  board(frame, hi); ctx.restore();
  hackMeter(frame);
  if (frame>=F_COUNT && frame<CLUE) countdown(frame);
  if (frame > CLUE) missionBox(T.missed, CLUE+1, frame, C.hot);
  else missionBox(T.m2, F_BOARD+4, frame);
  if (frame===CLUE+1){ ctx.fillStyle='rgba(125,255,178,0.5)'; ctx.fillRect(0,0,W,H); }
  text(BRAND, 360, 1240, 18, 'rgba(255,255,255,0.4)', 800);
}

/* ================= CAPA ================= */
function renderCover(){
  ctx.setTransform(S,0,0,S,0,0);
  sky(40, 0); pigCool(322, 826, 0.64, 0.2); car(360, 880, 0, false);
  hud(0, 3, 0);
  ctx.fillStyle='rgba(18,8,33,0.35)'; ctx.fillRect(0,170,W,330);
  titleBlock(250);
  neon('VOCÊ DECIDE O PLANO', 360, 400, 40, C.yellow, C.orange);
  for (let i=0;i<3;i++){ const x=170+i*190; rr(x-76,440,152,64,14); ctx.fillStyle='rgba(18,8,33,0.9)'; ctx.fill(); ctx.strokeStyle=C.cyan; ctx.lineWidth=3; ctx.stroke();
    text(`${i+1}`, x-48, 472, 34, C.hot, 900); fitText(PLANS[i].n.split(' ')[1], x+14, 472, 90, 20, C.white, 900); }
  rr(110,1080,500,90,45); ctx.fillStyle=C.hot; ctx.fill(); neon('COMENTA 1, 2 OU 3', 360, 1126, 38, C.white, '#7a0020', 460);
  text(BRAND, 360, 1240, 18, 'rgba(255,255,255,0.5)', 800);
  return cv.toDataURL('image/png');
}

/* ================= EXPORT ================= */
const HACK_BEEPS=[]; { let last=-1; for(let f=F_BOARD; f<CLUE; f++){ const pc=hackPct(f), st = pc<90 ? Math.floor(pc/10) : 9+(pc-89); if (st!==last && pc>0){ HACK_BEEPS.push(f); last=st; } } }
const CYCLE=[]; { let f=F_CYCLE, d=16; while (f<F_COUNT){ CYCLE.push(f); f+=Math.max(4,Math.round(d)); d*=0.88; } }
window.TOTAL_FRAMES = TOTAL_FRAMES;
window.META = { total: TOTAL_FRAMES, hook: F_HOOK, board: F_BOARD, clue: CLUE, vote: F_VOTE, count:[0,1,2].map(i=>F_COUNT+i*10), beeps: HACK_BEEPS, cycle: CYCLE, drive:[F_DRIVE, F_BOARD-20] };
window.renderFrame = f => { render(f); return cv.toDataURL('image/png'); };
window.renderCover = renderCover;

if (!location.search.includes('export')){
  let f=0, paused=false, last=performance.now(), acc=0;
  const toggle=()=>paused=!paused; cv.addEventListener('click',toggle);
  addEventListener('keydown',e=>{ if(e.code==='Space'){toggle();e.preventDefault();}
    if(paused&&e.code==='ArrowRight'){f=(f+1)%TOTAL_FRAMES;render(f);} if(paused&&e.code==='ArrowLeft'){f=(f-1+TOTAL_FRAMES)%TOTAL_FRAMES;render(f);} });
  document.fonts.ready.then(()=>{ (function loop(now){ acc+=now-last; last=now;
    if(!paused){ while(acc>=1000/FPS){ acc-=1000/FPS; f=(f+1)%TOTAL_FRAMES; } render(f);} else acc=0;
    requestAnimationFrame(loop); })(performance.now()); });
}
</script>
