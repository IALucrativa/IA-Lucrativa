<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pare o Balão</title>
<style>
  html,body{margin:0;background:#04070f;height:100%;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ================= CONFIG ================= */
const WORD     = "FORTUNA";                       // palavra secreta (1 letra por rodada)
const BRAND    = "@vocedecideai.br";              // marca d'agua
const FPS      = 30;
const APPROACH = [54, 45, 60, 39, 51, 42, 57];    // frames enchendo em cada rodada
const STYLE    = [0, 3, 2, 1, 0, 2, 1];           // curva de enchimento
const STROKES  = [6, 5, 7, 4, 6, 5, 7];           // bombadas por rodada
const COLORS   = ['#ff4d6d','#00c6ff','#a66bff','#00e5a0','#ff9f43','#ff5fd2','#3d8bff'];
const BREAK    = 22;
const OUTRO    = 45;

/* ================= TIMELINE ================= */
const ROUNDS = [];
{ let f = 0;
  for (let i = 0; i < WORD.length; i++) {
    ROUNDS.push({ start: f, contact: f + APPROACH[i], end: f + APPROACH[i] + BREAK, A: APPROACH[i], style: STYLE[i] });
    f += APPROACH[i] + BREAK;
  }
}
const OUTRO_START = ROUNDS[ROUNDS.length - 1].end;
const TOTAL_FRAMES = OUTRO_START + OUTRO;

/* ================= HELPERS ================= */
const W = 720, H = 1280;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const S = cv.width / W;
const C = { surf2:'#101928', cyan:'#00c6ff', gold:'#f5c842', green:'#00e5a0', red:'#ff4d5e', orange:'#ff9f43', text:'#e8f0fe', muted:'#8899bb' };
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function text(s,x,y,size,color,weight=900,align='center',font='Inter'){
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
function fitText(s,x,y,maxW,size,color,weight=900){
  ctx.font = `${weight} ${size}px Inter`; const w = ctx.measureText(s).width;
  if (w > maxW) size *= maxW / w; text(s,x,y,size,color,weight); }
function shade(hex, k){ // k>0 clareia, k<0 escurece
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.round(k>0? v+(255-v)*k : v*(1+k)); return `rgb(${f(r)},${f(g)},${f(b)})`; }

function ease(p, style){
  if (style===0) return p*p*(3-2*p)*0.35 + p*0.65;
  if (style===1) return Math.pow(p, 1.8);
  if (style===2) return p<0.55 ? p/0.55*0.62 : 0.62 + (p<0.75?0:(p-0.75)/0.25*0.38);
  return 1 - Math.pow(1-p, 1.6);
}

/* ================= GEOMETRY ================= */
const TABLE_Y = 968, KNOT_Y = 938, BEAM_Y = 438, TIP_Y = 590, BX = 380;
const R_START = 96, R_CONTACT = (KNOT_Y - TIP_Y) / 2;

/* bombadas (para o audio) */
const PUMP_EVENTS = [];
ROUNDS.forEach((r,i)=>{ let last=0; for(let lf=0; lf<=r.A; lf++){ const ph=ease(lf/r.A,r.style)*STROKES[i]; const n=Math.floor(ph+0.5);
  if(n>last){ PUMP_EVENTS.push(r.start+lf); last=n; } } });

/* ================= DRAW ================= */
function background(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a0b24'); g.addColorStop(.55,'#04070f'); g.addColorStop(1,'#020409');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(166,107,255,0.05)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const r = ctx.createRadialGradient(BX,800,20,BX,800,400); r.addColorStop(0,'rgba(166,107,255,0.16)'); r.addColorStop(1,'rgba(166,107,255,0)');
  ctx.fillStyle=r; ctx.fillRect(0,400,W,900);
}

function header(){
  fitText('PARE ANTES DO BALÃO ESTOURAR', 360, 150, 650, 42, '#ffffff', 900);
  ctx.font='800 17px Inter';
  const t1='NÍVEL IMPOSSÍVEL', t2=' · SÓ 1 FRAME REVELA A LETRA';
  const w1=ctx.measureText(t1).width, w2=ctx.measureText(t2).width, x0=360-(w1+w2)/2;
  text(t1, x0, 190, 17, C.red, 800, 'left'); text(t2, x0+w1, 190, 17, '#b48cff', 800, 'left');
}

function hud(idx, ms, p, psi, broke, gold){
  const x=92,y=228,w=536,h=142;
  const border = gold ? C.gold : broke ? C.red : 'rgba(166,107,255,0.35)';
  ctx.save(); if (gold){ ctx.shadowColor=C.gold; ctx.shadowBlur=28; } if (broke){ ctx.shadowColor=C.red; ctx.shadowBlur=18; }
  rr(x,y,w,h,18); ctx.fillStyle='rgba(11,12,32,0.92)'; ctx.fill(); ctx.restore();
  rr(x,y,w,h,18); ctx.strokeStyle=border; ctx.lineWidth=2.5; ctx.stroke();
  const mono='DejaVu Sans Mono';
  text(`BALÃO ${idx+1}/${WORD.length}`, x+24, y+28, 15, C.muted, 700, 'left', mono);
  text(`PRESSÃO ${broke?'---':psi.toFixed(1)+' psi'}`, x+w-24, y+28, 15, C.muted, 700, 'right', mono);
  let label, col;
  if (gold){ label='AGORA!'; col=C.gold; }
  else if (broke){ label='ESTOUROU!'; col=C.red; }
  else if (ms>1000){ label='CALMO'; col=C.green; }
  else if (ms>500){ label='ENCHENDO'; col=C.cyan; }
  else if (ms>200){ label='ESTICANDO'; col=C.orange; }
  else { label='QUASE!'; col=C.gold; }
  text(label, x+24, y+72, 38, col, 900, 'left');
  const msTxt = (ms>0?'-':ms<0?'+':'') + Math.abs(Math.round(ms)) + ' ms';
  text(msTxt, x+w-24, y+72, 30, gold?C.gold:broke?C.red:C.text, 700, 'right', mono);
  const bx=x+24, by=y+104, bw=w-48, bh=10, lim=0.82;
  rr(bx,by,bw,bh,5); ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fill();
  const g=ctx.createLinearGradient(bx,0,bx+bw*lim,0); g.addColorStop(0,C.green); g.addColorStop(.5,C.cyan); g.addColorStop(.85,C.gold); g.addColorStop(1,C.orange);
  rr(bx,by,bw*lim,bh,5); ctx.fillStyle=g; ctx.fill();
  rr(bx+bw*lim+3,by,bw*(1-lim)-3,bh,5); ctx.fillStyle='rgba(255,77,94,0.55)'; ctx.fill();
  const pp=clamp(p,0,1.2), mx = bx + bw*lim*Math.min(pp,1) + (pp>1 ? bw*(1-lim)*(pp-1)/0.2 : 0);
  ctx.fillStyle='#fff'; ctx.fillRect(mx-2,by-7,4,bh+14);
  text('LIMITE', bx+bw*lim-6, by+26, 11, C.green, 800, 'right', mono);
  text('ESTOURO', bx+bw-2, by+26, 11, C.red, 800, 'right', mono);
}

function frameAndNeedle(){
  const g=ctx.createLinearGradient(0,BEAM_Y-16,0,BEAM_Y+16); g.addColorStop(0,'#3d3a63'); g.addColorStop(1,'#1b1a34');
  ctx.fillStyle=g; rr(70,BEAM_Y-16,580,32,6); ctx.fill();
  ctx.fillStyle='#b48cff'; for(let x=96;x<640;x+=44){ctx.beginPath();ctx.arc(x,BEAM_Y,3,0,7);ctx.fill();}
  ctx.fillStyle='#16152c'; ctx.fillRect(84,BEAM_Y+16,22,TABLE_Y-BEAM_Y-16); ctx.fillRect(614,BEAM_Y+16,22,TABLE_Y-BEAM_Y-16);
  ctx.fillStyle='rgba(166,107,255,0.3)'; ctx.fillRect(104,BEAM_Y+16,2,TABLE_Y-BEAM_Y-16); ctx.fillRect(614,BEAM_Y+16,2,TABLE_Y-BEAM_Y-16);
  // suporte
  ctx.fillStyle='#4a4f6a'; rr(BX-30,BEAM_Y+14,60,34,6); ctx.fill();
  ctx.fillStyle='#ff4d5e'; ctx.fillRect(BX-30,BEAM_Y+40,60,6);
  // agulha
  const ng=ctx.createLinearGradient(BX-10,0,BX+10,0); ng.addColorStop(0,'#7d8799'); ng.addColorStop(.4,'#f2f5fa'); ng.addColorStop(1,'#5b6476');
  ctx.fillStyle=ng; ctx.beginPath(); ctx.moveTo(BX-9,BEAM_Y+48); ctx.lineTo(BX+9,BEAM_Y+48); ctx.lineTo(BX+6,TIP_Y-34); ctx.lineTo(BX,TIP_Y); ctx.lineTo(BX-6,TIP_Y-34); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(BX-2,TIP_Y-40,2.5,0,7); ctx.fill();
}

function table(){
  const g=ctx.createLinearGradient(0,TABLE_Y,0,TABLE_Y+40); g.addColorStop(0,'#2a2850'); g.addColorStop(1,'#13122a');
  ctx.fillStyle=g; rr(60,TABLE_Y,600,36,6); ctx.fill();
  ctx.fillStyle='#b48cff'; ctx.fillRect(60,TABLE_Y,600,3);
  ctx.fillStyle='#0b0c20'; ctx.fillRect(110,TABLE_Y+36,500,260);
  ctx.fillStyle='rgba(166,107,255,0.08)'; for(let x=130;x<600;x+=40) ctx.fillRect(x,TABLE_Y+36,2,260);
}

function pump(phase){
  const px=168, top=826, plunge = 44*(0.5-0.5*Math.cos(phase*Math.PI*2));
  // mangueira ate o bico
  ctx.strokeStyle='#2c2b44'; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(px+18,TABLE_Y-12);
  ctx.bezierCurveTo(px+90,TABLE_Y+4, BX-90,TABLE_Y+4, BX-14,TABLE_Y-14); ctx.stroke();
  ctx.strokeStyle='#ff4d5e'; ctx.lineWidth=3; ctx.stroke();
  // haste e alca
  const hy = top-70+plunge;
  ctx.fillStyle='#c5cbe0'; ctx.fillRect(px-4, hy, 8, top-hy+4);
  ctx.fillStyle='#ff4d5e'; rr(px-44, hy-14, 88, 18, 9); ctx.fill();
  // corpo
  const g=ctx.createLinearGradient(px-22,0,px+22,0); g.addColorStop(0,'#3a3f5e'); g.addColorStop(.45,'#8a91b4'); g.addColorStop(1,'#2a2e46');
  ctx.fillStyle=g; rr(px-22, top, 44, TABLE_Y-top, 8); ctx.fill();
  ctx.fillStyle='#ff4d5e'; ctx.fillRect(px-22, top+20, 44, 6);
  ctx.fillStyle='#1d1f33'; rr(px-34, TABLE_Y-10, 68, 12, 4); ctx.fill();
  // bico do balao
  ctx.fillStyle='#4a4f6a'; rr(BX-18, KNOT_Y+6, 36, TABLE_Y-KNOT_Y-6, 6); ctx.fill();
}

function balloon(cx, r, color, gold, letter, worry, frame){
  const rx=r*0.9, ry=r, cy=KNOT_Y-r;
  ctx.save();
  // sombra na mesa
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(cx,TABLE_Y+2,rx*0.8,10,0,0,7); ctx.fill();
  const base = gold ? '#f5c842' : color;
  // forma (gota levemente afunilada embaixo)
  ctx.beginPath();
  ctx.moveTo(cx, cy-ry);
  ctx.bezierCurveTo(cx+rx*1.1, cy-ry, cx+rx*1.05, cy+ry*0.55, cx+8, cy+ry-4);
  ctx.lineTo(cx-8, cy+ry-4);
  ctx.bezierCurveTo(cx-rx*1.05, cy+ry*0.55, cx-rx*1.1, cy-ry, cx, cy-ry);
  ctx.closePath();
  const g=ctx.createRadialGradient(cx-rx*0.35,cy-ry*0.4,4,cx,cy,r*1.2);
  if (gold){ g.addColorStop(0,'#fff6c0'); g.addColorStop(.45,'#f5c842'); g.addColorStop(1,'#a8770a'); }
  else { g.addColorStop(0,shade(base,0.55)); g.addColorStop(.5,base); g.addColorStop(1,shade(base,-0.55)); }
  ctx.fillStyle=g; ctx.fill();
  if (!gold && worry>0){ ctx.fillStyle=`rgba(255,255,255,${0.14*worry})`; ctx.fill(); } // pele fininha
  // brilho
  ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(cx-rx*0.42,cy-ry*0.45,rx*0.12,ry*0.22,-0.5,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(cx-rx*0.22,cy-ry*0.72,r*0.05,0,7); ctx.fill();
  // no
  ctx.fillStyle=gold?'#a8770a':shade(base,-0.4); ctx.beginPath(); ctx.moveTo(cx-10,KNOT_Y+8); ctx.lineTo(cx+10,KNOT_Y+8); ctx.lineTo(cx+5,KNOT_Y-4); ctx.lineTo(cx-5,KNOT_Y-4); ctx.fill();
  if (gold){
    ctx.save(); ctx.shadowColor='rgba(90,60,0,0.8)'; ctx.shadowOffsetY=5;
    text(letter, cx, cy+8, r*0.95, '#fffbe6', 900); ctx.restore();
    ctx.textAlign='center'; ctx.strokeStyle='rgba(122,86,0,0.6)'; ctx.lineWidth=2; ctx.font=`900 ${r*0.95}px Inter`; ctx.strokeText(letter,cx,cy+8);
  } else {
    // rostinho
    const ex=r*0.24, ey=cy+r*0.12, es=r*0.1;
    for (const s of [-1,1]){
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(cx+s*ex,ey,es,es*(1.15+worry*0.3),0,0,7); ctx.fill();
      ctx.fillStyle='#10131c'; ctx.beginPath(); ctx.arc(cx+s*ex, ey+es*0.3-worry*es*0.75, es*0.5, 0, 7); ctx.fill();
      if (worry>0.3){ ctx.strokeStyle=shade(base,-0.6); ctx.lineWidth=3; ctx.beginPath();
        ctx.moveTo(cx+s*(ex-es*1.2), ey-es*1.6-worry*4); ctx.lineTo(cx+s*(ex+es*0.9), ey-es*2.1); ctx.stroke(); }
    }
    ctx.fillStyle=shade(base,-0.65);
    if (worry>0.6){ ctx.beginPath(); ctx.ellipse(cx, ey+es*2.3, es*0.45, es*0.6, 0, 0, 7); ctx.fill(); }
    else { ctx.strokeStyle=shade(base,-0.65); ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx, ey+es*1.4, es*0.8, 0.2*Math.PI, 0.8*Math.PI); ctx.stroke(); }
    if (worry>0.55){ // gota de suor
      const dy=(frame*2)%24, sx=cx+rx*0.55, sy=cy-ry*0.25+dy;
      ctx.fillStyle='rgba(126,224,255,0.9)'; ctx.beginPath(); ctx.moveTo(sx,sy-10); ctx.quadraticCurveTo(sx-8,sy+4,sx,sy+6); ctx.quadraticCurveTo(sx+8,sy+4,sx,sy-10); ctx.fill();
    }
  }
  ctx.restore();
}

function sparkles(cx,cy,r){
  ctx.fillStyle='#fff';
  for (const [dx,dy,s] of [[-1.25,-0.6,16],[1.25,-0.3,12],[-1.1,0.5,10],[1.3,0.6,14],[0.5,-1.1,9]]){
    const x=cx+dx*r,y=cy+dy*r; ctx.beginPath();
    ctx.moveTo(x,y-s); ctx.quadraticCurveTo(x,y,x+s,y); ctx.quadraticCurveTo(x,y,x,y+s); ctx.quadraticCurveTo(x,y,x-s,y); ctx.quadraticCurveTo(x,y,x,y-s); ctx.fill();
  }
}

function goldBanner(idx){
  const x=40,y=982,w=640,h=108;
  ctx.save(); ctx.shadowColor=C.gold; ctx.shadowBlur=30; rr(x,y,w,h,18); ctx.fillStyle='rgba(20,16,4,0.95)'; ctx.fill(); ctx.restore();
  rr(x,y,w,h,18); ctx.strokeStyle=C.gold; ctx.lineWidth=3; ctx.stroke();
  fitText(`BALÃO DE OURO! LETRA ${idx+1}/${WORD.length}`, 360, y+38, 590, 30, C.gold, 900);
  fitText('JUNTE AS 7 LETRAS E COMENTA A PALAVRA', 360, y+80, 590, 22, '#ffffff', 800);
}

function pop(round, idx, tb){
  const R = rng(round.start*7919+77), g=2200, col=COLORS[idx];
  const cx=BX, cy=KNOT_Y-R_CONTACT, r=R_CONTACT;
  if (tb<0.22){ // flash + anel
    const k=tb/0.22;
    if (tb<0.07){ ctx.fillStyle=`rgba(255,255,255,${0.35*(1-tb/0.07)})`; ctx.beginPath(); ctx.arc(cx,cy,r*1.05,0,7); ctx.fill(); }
    ctx.strokeStyle=`rgba(255,255,255,${1-k})`; ctx.lineWidth=6*(1-k)+1; ctx.beginPath(); ctx.arc(cx,cy,r*(1+1.2*k),0,7); ctx.stroke();
    ctx.strokeStyle=`rgba(245,200,66,${1-k})`; ctx.lineWidth=4;
    for(let i=0;i<14;i++){ const a=i/14*Math.PI*2, r1=r*(1.1+k), r2=r1+36; ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2); ctx.stroke(); }
  }
  if (tb<0.3){ // "POP!"
    const k=tb/0.3, s=1+0.6*k;
    ctx.save(); ctx.globalAlpha=1-k*k; ctx.translate(cx,cy); ctx.scale(s,s); ctx.rotate(-0.08);
    ctx.font='900 92px Inter'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=12; ctx.strokeStyle='#ff4d5e'; ctx.strokeText('POP!',0,0); ctx.fillStyle='#fff'; ctx.fillText('POP!',0,0); ctx.restore();
  }
  // retalhos de borracha
  for(let i=0;i<14;i++){
    const a=R()*Math.PI*2, sp=500+R()*700, x0=cx+Math.cos(a)*r*0.9, y0=cy+Math.sin(a)*r*0.9;
    const x=x0+Math.cos(a)*sp*tb, y=y0+Math.sin(a)*sp*tb+0.5*g*tb*tb, rot=(R()-0.5)*16*tb, s=14+R()*16;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a+rot); ctx.fillStyle=i%2?col:shade(col,-0.35);
    ctx.beginPath(); ctx.moveTo(-s,0); ctx.quadraticCurveTo(0,-s*0.9,s,0); ctx.quadraticCurveTo(0,-s*0.3,-s,0); ctx.fill(); ctx.restore();
  }
  // confete
  const cols=[C.gold,C.cyan,C.green,'#ff5fd2','#fff',C.orange];
  for(let i=0;i<46;i++){
    const a=R()*Math.PI*2, sp=300+R()*650, x0=cx+(R()-0.5)*r, y0=cy+(R()-0.5)*r;
    const drag=Math.min(tb,0.35), x=x0+Math.cos(a)*sp*drag+Math.sin(tb*10+i)*10, y=y0+Math.sin(a)*sp*drag+0.5*700*tb*tb;
    ctx.save(); ctx.translate(x,y); ctx.rotate(tb*(6+i%5)+i); ctx.fillStyle=cols[i%cols.length];
    ctx.fillRect(-5,-3*Math.abs(Math.cos(tb*12+i)),10,6*Math.abs(Math.cos(tb*12+i))+1); ctx.restore();
  }
  // moedas
  for(let i=0;i<14;i++){
    const vx=(R()-0.5)*900, vy=-400-R()*700, x0=cx+(R()-0.5)*120, y0=cy, spin=8+R()*12, rad=11+R()*5;
    const x=x0+vx*tb, y=y0+vy*tb+0.5*g*tb*tb, sx=Math.max(Math.abs(Math.cos(spin*tb+i)),0.14);
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle='#b8860b'; ctx.beginPath(); ctx.ellipse(0,1.5,rad*sx,rad,0,0,7); ctx.fill();
    ctx.fillStyle=C.gold; ctx.beginPath(); ctx.ellipse(0,0,rad*sx,rad,0,0,7); ctx.fill();
    if (sx>0.5) text('$',0,1,rad*1.1,'#8a6200',900);
    ctx.restore();
  }
  // resto do balao murcho no bico
  ctx.fillStyle=shade(col,-0.3); ctx.beginPath(); ctx.moveTo(cx-10,KNOT_Y+8); ctx.lineTo(cx+10,KNOT_Y+8);
  ctx.quadraticCurveTo(cx+18,KNOT_Y-14,cx+4,KNOT_Y-22); ctx.quadraticCurveTo(cx-14,KNOT_Y-10,cx-10,KNOT_Y+8); ctx.fill();
}

function outro(f){
  const k = clamp(f/8,0,1);
  ctx.fillStyle=`rgba(4,7,15,${0.88*k})`; ctx.fillRect(0,0,W,H);
  if (k<1) return;
  const pop = 1 + 0.06*Math.sin(f*0.25);
  ctx.save(); ctx.translate(360,520); ctx.scale(pop,pop); fitText('ACHOU AS 7 LETRAS?', 0, 0, 620, 54, '#ffffff', 900); ctx.restore();
  text('PAUSE NO FRAME CERTO EM CADA BALÃO', 360, 580, 20, '#b48cff', 800);
  const n=WORD.length, sw=74, gap=12, x0=360-(n*sw+(n-1)*gap)/2;
  for(let i=0;i<n;i++){
    const x=x0+i*(sw+gap), y=660, d=clamp((f-10-i*2)/6,0,1);
    ctx.globalAlpha=d; rr(x,y,sw,92,14); ctx.fillStyle=C.surf2; ctx.fill(); ctx.strokeStyle=C.gold; ctx.lineWidth=3; ctx.stroke();
    text('?', x+sw/2, y+48, 48, C.gold, 900); ctx.globalAlpha=1;
  }
  const b = clamp((f-22)/6,0,1); ctx.globalAlpha=b;
  rr(110,820,500,86,43); ctx.fillStyle=C.green; ctx.fill();
  text('COMENTA A PALAVRA', 360, 864, 32, '#04130d', 900);
  text('e me segue pra mais desafios', 360, 950, 24, C.text, 600);
  ctx.globalAlpha=1;
}

/* ================= FRAME ================= */
function render(frame){
  ctx.setTransform(S,0,0,S,0,0);
  background(); header();
  let ri = ROUNDS.findIndex(r=>frame<r.end); if (ri<0) ri = ROUNDS.length-1;
  const round = ROUNDS[ri];
  const lf = Math.min(frame, round.end-1) - round.start;
  const gold = lf===round.A, broke = lf>round.A;
  const p = lf/round.A, e = ease(clamp(p,0,1), round.style);
  const ms = (round.A-lf)*1000/FPS;
  const r = R_START + (R_CONTACT-R_START)*e;
  const worry = broke?0:clamp(1-ms/900,0,1);
  const jitter = (!broke && !gold && worry>0.5) ? Math.sin(frame*2.9)*2.5*worry : 0;
  let sx=0, sy=0;
  if (broke){ const tb=(lf-round.A)/FPS; if (tb<0.18){ const R=rng(frame); sx=(R()-0.5)*16*(1-tb/0.18); sy=(R()-0.5)*16*(1-tb/0.18);} }

  ctx.save(); ctx.translate(sx,sy);
  frameAndNeedle(); table();
  pump(broke ? STROKES[ri] : e*STROKES[ri]);
  if (!broke) balloon(BX+jitter, r, COLORS[ri], gold, WORD[ri], worry, frame);
  if (gold) sparkles(BX, KNOT_Y-r, r);
  if (broke) pop(round, ri, (lf-round.A)/FPS);
  ctx.restore();

  hud(ri, ms, p, 2+26*e, broke, gold);
  if (gold) goldBanner(ri);

  for(let i=0;i<ROUNDS.length;i++){
    const x=360+(i-(ROUNDS.length-1)/2)*44, y=1110, done=i<ri||(i===ri&&broke), cur=i===ri&&!broke;
    ctx.beginPath(); ctx.arc(x,y,cur?13:10,0,7);
    ctx.fillStyle= done?'rgba(255,77,94,0.85)': cur?COLORS[i]:'rgba(255,255,255,0.08)'; ctx.fill();
    if(cur){ ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(x,y,20,0,7); ctx.stroke(); }
  }
  text('BALÕES', 360, 1150, 14, 'rgba(136,153,187,0.8)', 800);
  text(BRAND, 360, 1215, 18, 'rgba(232,240,254,0.4)', 800);
  if (frame>=OUTRO_START) outro(frame-OUTRO_START);
}

/* ================= CAPA ================= */
function renderCover(){
  ctx.setTransform(S,0,0,S,0,0);
  background();
  ctx.save(); ctx.translate(0,110);
  frameAndNeedle(); table(); pump(0.3);
  balloon(BX, R_CONTACT-7, COLORS[0], false, '', 1, 4);
  ctx.strokeStyle=C.red; ctx.lineWidth=5; ctx.lineCap='round';
  for (const [x1,y1,x2,y2] of [[330,600,300,575],[430,600,460,575],[320,630,285,630],[440,630,475,630]]){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ctx.translate(360,196); ctx.rotate(-0.04);
  rr(-170,-26,340,52,26); ctx.fillStyle=C.red; ctx.fill(); text('NÍVEL IMPOSSÍVEL', 0, 1, 26, '#fff', 900); ctx.restore();
  ctx.save(); ctx.shadowColor='rgba(245,200,66,0.6)'; ctx.shadowBlur=30;
  fitText('SÓ 1 FRAME', 360, 300, 640, 118, C.gold, 900); ctx.restore();
  fitText('REVELA A PALAVRA', 360, 392, 640, 62, '#ffffff', 900);
  ctx.save(); ctx.translate(575,500); ctx.rotate(0.12);
  rr(-62,-40,124,80,20); ctx.fillStyle='rgba(20,16,4,0.95)'; ctx.fill(); ctx.strokeStyle=C.gold; ctx.lineWidth=3; ctx.stroke();
  text('7 LETRAS', 0, -12, 18, C.gold, 900); text('? ? ?', 0, 16, 22, '#fff', 900); ctx.restore();
  rr(120,1150,480,80,40); ctx.fillStyle=C.green; ctx.fill();
  text('VOCÊ CONSEGUE PAUSAR?', 360, 1191, 28, '#04130d', 900);
  return cv.toDataURL('image/png');
}

window.TOTAL_FRAMES = TOTAL_FRAMES; window.ROUNDS = ROUNDS; window.OUTRO_START = OUTRO_START; window.PUMP_EVENTS = PUMP_EVENTS;
window.renderFrame = f => { render(f); return cv.toDataURL('image/png'); };
window.renderCover = renderCover;

if (!location.search.includes('export')){
  let f=0, paused=false, last=performance.now(), acc=0;
  const toggle=()=>paused=!paused; cv.addEventListener('click',toggle);
  addEventListener('keydown',e=>{ if(e.code==='Space'){toggle();e.preventDefault();}
    if(paused&&e.code==='ArrowRight'){f=(f+1)%TOTAL_FRAMES;render(f);} if(paused&&e.code==='ArrowLeft'){f=(f-1+TOTAL_FRAMES)%TOTAL_FRAMES;render(f);} });
  document.fonts.ready.then(()=>{ (function loop(now){ acc+=now-last; last=now;
    if(!paused){ while(acc>=1000/FPS){ acc-=1000/FPS; f=(f+1)%TOTAL_FRAMES; } render(f);} else acc=0;
    requestAnimationFrame(loop); })(performance.now()); });
}
</script>
