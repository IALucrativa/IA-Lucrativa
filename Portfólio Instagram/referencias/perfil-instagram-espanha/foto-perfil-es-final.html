<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Foto de perfil España</title>
<style>body{margin:0}svg{display:block;width:1080px;height:1080px}</style></head><body>
<!-- Igual à logo do Brasil (opção C: balão escuro no amarelo); só o "play" vira a bandeira da Espanha
     (faixas vermelho 1/4, amarelo 1/2, vermelho 1/4). -->
<svg id="logo" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#ffd75a"/><stop offset="1" stop-color="#f2a91c"/></radialGradient>
    <mask id="play">
      <path d="M-70,-150 L130,-40 L-70,70 Z" fill="#fff" stroke="#fff" stroke-width="40" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="1080" height="1080" fill="url(#g)"/>
  <g transform="translate(540,520)">
    <path d="M-300,-230 Q-300,-280 -250,-280 L250,-280 Q300,-280 300,-230 L300,150 Q300,200 250,200 L-40,200 L-170,320 L-140,200 L-250,200 Q-300,200 -300,150 Z"
      fill="#1b1b2a" stroke="#1b1b2a" stroke-width="34" stroke-linejoin="round"/>
    <g mask="url(#play)">
      <rect x="-100" y="-175" width="260" height="270" fill="#c60b1e"/>
      <rect x="-100" y="-105" width="260" height="130" fill="#ffc400"/>
    </g>
  </g>
</svg></body></html>
